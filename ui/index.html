<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>
<style>
:root{
  --bg:#0a0a0f; --panel:#13131a; --panel2:#1b1b24; --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.16); --tx:#ededf3; --dim:#8b8b9b; --dim2:#5b5b6b;
  --ac:#7c7cf0; --ac2:#a6a6ff; --acdim:rgba(124,124,240,.16); --ok:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow:hidden;
  font:400 13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:0 18px;height:54px;flex:none;
  border-bottom:1px solid var(--line);background:rgba(12,12,18,.6);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:9px;padding-right:6px;flex:none}
.mark{width:20px;height:20px;border-radius:6px;background:linear-gradient(140deg,var(--ac2),var(--ac));
  box-shadow:0 0 16px rgba(124,124,240,.5)}
.brand span{font-size:15px;font-weight:650;letter-spacing:-.01em}
.proj{position:relative;flex:none}
.projbtn{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;
  border:1px solid var(--line2);background:var(--panel);font-size:13px;font-weight:550;
  color:var(--tx);transition:.15s}
.projbtn:hover{border-color:var(--ac);background:var(--panel2)}
.projbtn .caret{width:12px;height:12px;stroke:var(--dim);fill:none;stroke-width:2}
.projmenu{position:absolute;top:42px;left:0;z-index:70;width:280px;padding:8px;display:none;
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
.projmenu.on{display:block}
.pm-head{display:flex;gap:7px;padding:2px 2px 8px;border-bottom:1px solid var(--line)}
.pm-head input{flex:1;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--tx);font:inherit;outline:none}
.pm-head input:focus{border-color:var(--ac)}
.pm-head button{height:32px;padding:0 11px;border-radius:8px;background:var(--ac);color:#fff;
  font-size:12.5px;font-weight:600;flex:none}
.pm-head button:hover{filter:brightness(1.12)}
.pm-list{max-height:220px;overflow-y:auto;margin:6px 0}
.pmi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:8px 10px;border-radius:8px;font-size:13px;color:var(--dim);text-align:left;transition:.12s}
.pmi:hover{background:var(--panel2);color:var(--tx)}
.pmi.on{color:var(--tx);background:var(--acdim)}
.pmi b{font-size:10.5px;font-weight:600;color:var(--dim2);font-variant-numeric:tabular-nums;flex:none}
.pm-new{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;
  border:1px dashed var(--line2);color:var(--dim);font-size:12.5px;font-weight:550;transition:.14s}
.pm-new:hover{color:var(--ac2);border-color:var(--ac);background:var(--acdim)}
.pm-new svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.grow{flex:1}
.stat{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);flex:none;
  font-variant-numeric:tabular-nums;padding:0 6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--bad)}
.vt{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--panel);
  border:1px solid var(--line);flex:none}
.vt button{width:30px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--dim2)}
.vt button:hover{color:var(--tx)}
.vt button.on{background:var(--panel2);color:var(--tx)}
.vt svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- gallery ---------- */
.main{position:relative;min-height:0;overflow:hidden}
.feed{height:100%;overflow-y:auto;padding:20px 22px 10px;scrollbar-gutter:stable}
.feedin{max-width:1240px;margin:0 auto}
.blank{padding:16vh 0;text-align:center;color:var(--dim)}
.blank p{font-size:14px;color:var(--dim)}
.blank b{color:var(--tx);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;aspect-ratio:16/9;border-radius:13px;overflow:hidden;cursor:grab;
  background:var(--panel);border:1px solid var(--line);transition:.18s}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.card.dragging{opacity:.35}
.card .acts{position:absolute;top:9px;right:9px;display:flex;gap:6px;opacity:0;transition:.15s}
.card:hover .acts{opacity:1}
.acb{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:rgba(10,10,16,.78);border:1px solid var(--line2);color:var(--tx);
  backdrop-filter:blur(6px);transition:.12s}
.acb:hover{background:var(--ac);border-color:var(--ac)}
.acb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.card .tag{position:absolute;left:10px;right:10px;bottom:9px;font-size:11px;font-weight:550;
  color:#fff;opacity:0;transition:.15s;text-shadow:0 1px 8px rgba(0,0,0,.95);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card:hover .tag{opacity:1}
/* list view */
.grid.list{grid-template-columns:1fr;gap:8px}
.grid.list .card{aspect-ratio:auto;display:grid;grid-template-columns:150px 1fr;align-items:center;
  gap:14px;padding:9px;cursor:pointer}
.grid.list .card img{height:84px;border-radius:10px}
.grid.list .card:hover{transform:none}
.grid.list .tag{position:static;opacity:1;text-shadow:none;color:var(--dim);white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid.list .acts{top:50%;right:14px;transform:translateY(-50%);opacity:1}
.working{grid-column:1/-1;border-radius:13px;border:1px dashed var(--line2);background:var(--panel);
  display:grid;place-items:center;min-height:160px}
.spin{width:26px;height:26px;border:2.5px solid var(--line2);border-top-color:var(--ac2);
  border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 11px}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--dim2);font-size:12.5px;text-align:center;font-variant-numeric:tabular-nums}
.err{margin:0 auto 14px;max-width:640px;color:#fca5a5;background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.25);padding:13px 15px;border-radius:12px;
  font-size:12.5px;white-space:pre-wrap}

/* ---------- drop overlay ---------- */
.drop{position:absolute;inset:8px;z-index:40;display:none;place-items:center;
  background:rgba(10,10,16,.88);backdrop-filter:blur(8px);border:2px dashed var(--ac2);
  border-radius:16px}
.drop.on{display:grid}
.drop div{color:var(--ac2);font-size:15px;font-weight:550}

/* ---------- dock / composer ---------- */
.dock{flex:none;border-top:1px solid var(--line);background:rgba(12,12,18,.85);
  backdrop-filter:blur(16px);padding:12px 22px 16px}
.dockin{max-width:1240px;margin:0 auto}
/* reference clips rail */
.railcap{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
.railcap .rc{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--dim2)}
.railcap .rhint{font-size:11px;color:var(--dim2)}
.railcap .rhint b{color:var(--ac2);font-weight:600}
.rail{display:flex;gap:9px;overflow-x:auto;padding-bottom:9px;margin-bottom:10px;
  border-bottom:1px solid var(--line)}
.cl{position:relative;width:96px;height:60px;flex:none;border-radius:9px;overflow:hidden;cursor:grab;
  border:1px solid var(--line);background:var(--panel);transition:.15s}
.cl:hover{border-color:var(--ac);transform:translateY(-1px)}
.cl.dragging{opacity:.4}
.cl img{width:100%;height:100%;object-fit:cover;display:block}
.cl .cln{position:absolute;left:4px;right:4px;bottom:4px;font-size:8.5px;font-weight:650;color:#fff;
  text-shadow:0 1px 5px rgba(0,0,0,.95);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .rm{position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:50%;display:none;
  place-items:center;background:rgba(0,0,0,.75);color:#fff;font-size:10px;line-height:1}
.cl:hover .rm{display:grid}
.addclip{width:60px;height:60px;flex:none;border-radius:9px;border:1px dashed var(--line2);
  color:var(--dim2);font-size:20px;display:grid;place-items:center;transition:.14s}
.addclip:hover{color:var(--ac2);border-color:var(--ac);background:var(--acdim)}
/* selection row */
.attach{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:9px}
.attcap{display:flex;align-items:center;gap:8px;width:100%;font-size:10px;font-weight:700;
  letter-spacing:.14em;color:var(--dim2);margin-bottom:1px}
.attcap span:last-child{margin-left:auto;letter-spacing:0;font-variant-numeric:tabular-nums}
.att{position:relative;width:52px;height:52px;border-radius:10px;overflow:hidden;
  border:1px solid var(--line2);background:var(--panel2);flex:none}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att .idx{position:absolute;left:3px;bottom:3px;font-size:8.5px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.7);border-radius:5px;padding:1px 4px}
.att .x{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;
  background:rgba(0,0,0,.75);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center}
.att .x:hover{background:var(--bad)}
.chipstyle{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;
  background:var(--acdim);border:1px solid var(--ac);color:var(--ac2);font-size:11.5px;font-weight:600}
.chipstyle button{color:inherit;font-size:13px;line-height:1;padding:0}
/* prompt bar */
.bar{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 10px;
  background:var(--panel);border:1px solid var(--line2);border-radius:16px;transition:.16s}
.bar:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--acdim)}
#p{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;resize:none;
  padding:8px 4px;max-height:120px;line-height:1.5}
#p::placeholder{color:var(--dim2)}
.opt{display:flex;align-items:center;height:36px;padding:0 4px 0 10px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:550}
.opt select{appearance:none;background:none;border:0;color:inherit;font:inherit;outline:0;
  cursor:pointer;padding:0 6px}
.opt select option{background:#13131a;color:var(--tx)}
.ib{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);display:grid;place-items:center;transition:.14s}
.ib:hover{color:var(--tx);border-color:var(--line2)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.send{width:38px;height:38px;flex:none;border:0;border-radius:12px;color:#fff;
  background:linear-gradient(145deg,var(--ac2),var(--ac));display:grid;place-items:center;transition:.14s}
.send:hover:not(:disabled){filter:brightness(1.12)}
.send:disabled{opacity:.35;cursor:not-allowed}
.send svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4}
.hint{text-align:center;font-size:11px;color:var(--dim2);margin-top:8px;min-height:15px;
  font-variant-numeric:tabular-nums}

/* ---------- context menu ---------- */
.menu{position:fixed;z-index:80;min-width:188px;background:var(--panel);
  border:1px solid var(--line2);border-radius:12px;padding:5px;display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.7)}
.menu.on{display:block}
.mi{padding:8px 11px;border-radius:8px;font-size:12.5px;color:var(--tx);cursor:pointer;
  display:flex;justify-content:space-between;gap:14px}
.mi:hover{background:var(--panel2)}
.mi.dngr{color:#fca5a5}
.mi span{color:var(--dim2);font-size:11px}
.msep{height:1px;background:var(--line);margin:4px 6px}

/* ---------- lightbox (big preview) ---------- */
.lb{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:26px;
  background:rgba(5,5,9,.94);backdrop-filter:blur(12px)}
.lb.open{display:grid}
.lbin{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:min(1560px,96vw);
  max-height:100%}
.lbimg{max-width:96vw;max-height:74vh;object-fit:contain;border-radius:14px;
  box-shadow:0 30px 100px rgba(0,0,0,.7);display:block}
.lbcap{text-align:center;max-width:820px}
.lbcap h3{font-size:18px;font-weight:650;letter-spacing:-.01em;margin-bottom:3px}
.lbcap .lprompt{color:var(--dim);font-size:12.5px;max-width:720px;margin:0 auto 10px}
.lbcap .lmeta{color:var(--dim2);font-size:11px;font-variant-numeric:tabular-nums;margin-bottom:12px}
.lbacts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lbb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;
  font-size:12.5px;font-weight:600;border:1px solid var(--line2);background:var(--panel);transition:.13s}
.lbb:hover{border-color:var(--ac);color:var(--tx)}
.lbb.prim{background:var(--ac);border-color:var(--ac);color:#fff}
.lbb.prim:hover{filter:brightness(1.12)}
.lbb.dngr{color:#fca5a5}
.lbb.dngr:hover{border-color:var(--bad);background:rgba(248,113,113,.1)}
.lbb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* drag ghost */
.ghost{position:fixed;top:-100px;left:-100px;padding:6px 12px;border-radius:9px;background:var(--ac);
  color:#fff;font-size:12px;font-weight:600;pointer-events:none;z-index:200}

@media(max-width:760px){
  .brand span,.stat span:last-child{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark"></div><span>Studio</span></div>
    <div class="proj" id="projbox">
      <button class="projbtn" id="projbtn" title="Projects">
        <span id="pname">untitled</span>
        <svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="projmenu" id="projmenu">
        <div class="pm-head">
          <input id="projname" placeholder="Rename project…" spellcheck="false">
          <button id="projrename">Rename</button>
        </div>
        <div class="pm-list" id="pmList"></div>
        <button class="pm-new" id="newp"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New project</button>
      </div>
    </div>
    <div class="grow"></div>
    <div class="vt" id="vt">
      <button data-v="grid" class="on" title="Grid"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
      <button data-v="list" title="List"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg></button>
    </div>
    <div class="stat"><span class="dot" id="dot"></span><span id="stat">connecting</span></div>
  </header>

  <main class="main" id="main">
    <div class="feed" id="feed"><div class="feedin" id="feedin"></div></div>
    <div class="drop" id="drop"><div>Drop to add as reference</div></div>
  </main>

  <footer class="dock" id="dock">
    <div class="dockin">
      <div class="railcap"><span class="rc">REFERENCE CLIPS</span><span class="rhint">drag or click to use as style reference</span></div>
      <div class="rail" id="rail"></div>
      <div class="attach" id="attach"></div>
      <div class="bar">
        <textarea id="p" rows="1" placeholder="a stickman sweating beside a desk fan, blue airflow, red heat lines…"></textarea>
        <button class="ib" id="stylebtn" title="Preset style">
          <svg viewBox="0 0 24 24"><path d="m12 3 2.4 6.2L21 11l-6.6 1.8L12 19l-2.4-6.2L3 11l6.6-1.8z"/></svg>
        </button>
        <div class="opt" title="Aspect"><select id="ratio">
          <option value="1024x576">16:9</option><option value="576x1024">9:16</option>
          <option value="1024x1024">1:1</option><option value="1024x768">4:3</option></select></div>
        <div class="opt" title="Steps"><select id="steps">
          <option>6</option><option selected>8</option><option>12</option><option>16</option></select></div>
        <button class="send" id="go" aria-label="Generate">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </footer>
</div>

<div class="menu" id="menu"></div>
<div class="lb" id="lb"><div class="lbin" id="lbin"></div></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
const $ = id => document.getElementById(id);
const api = (p,o) => fetch('/api'+p,o).then(r => r.ok ? r.json()
  : r.json().then(e => Promise.reject(e.detail||r.statusText), () => Promise.reject(r.statusText)));
const jpost = (p,b) => api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const imgURL = (kind,name) => kind === 'frame'
  ? `/api/img?kind=frame&name=${encodeURIComponent(name)}`
  : `/api/img?kind=${kind}&project=${encodeURIComponent(project)}&name=${encodeURIComponent(name)}`;
const base = name => String(name).split('/').pop();

let project = localStorage.getItem('studio.project') || 'untitled';
let attached = [], shots = [], videos = [], busy = false;
let stylePreset = null, presets = {};
let view = localStorage.getItem('studio.view') || 'grid';

/* ---------- status ---------- */
async function poll(){
  try{
    const h = await api('/health'), s = await api('/stats');
    const up = h.status === 'ready';
    $('dot').className = 'dot ' + (up ? 'ok' : '');
    $('stat').textContent = up
      ? [h.vram_free_gb ? h.vram_free_gb+' GB free' : null, s.n ? 'median '+s.median_s+'s' : null]
        .filter(Boolean).join(' · ') || 'ready'
      : 'loading model…';
    $('go').disabled = !up || busy;
  }catch{ $('dot').className='dot bad'; $('stat').textContent='offline'; $('go').disabled=true; }
}

/* ---------- projects ---------- */
async function loadProjects(){
  const {projects} = await api('/projects');
  if(!projects.some(p => p.name === project)) project = projects[0].name;
  $('pname').textContent = project;
  $('pmList').innerHTML = projects.map(p =>
    `<button class="pmi${p.name===project?' on':''}" data-n="${p.name}">
       <span>${p.name}</span><b>${p.shots} shots</b></button>`).join('');
  localStorage.setItem('studio.project', project);
}
async function switchTo(name){
  project = name; attached = []; stylePreset = null; shots = [];
  $('p').value = ''; $('hint').textContent = '';
  await Promise.all([loadProjects(), loadRefs()]);
  paintAttach(); await loadShots();
}
async function uniqueProjectName(){
  const {projects} = await api('/projects');
  const taken = new Set(projects.map(p => p.name));
  let name = 'untitled', i = 1;
  while(taken.has(name)) name = `untitled ${++i}`;
  return name;
}
async function renameTo(name){
  name = (name||'').trim();
  if(!name || name === project) return closeProjMenu();
  const r = await jpost('/rename', {project, name});
  await switchTo(r.name);
  closeProjMenu();
}
function openProjMenu(){
  $('projmenu').classList.add('on');
  $('projname').value = project;
  $('projname').select();
  $('projname').focus();
}
function closeProjMenu(){ $('projmenu').classList.remove('on'); }
$('projbtn').onclick = e => { e.stopPropagation(); $('projmenu').classList.toggle('on'); };
$('pmList').onclick = e => {
  const b = e.target.closest('.pmi'); if(!b) return;
  closeProjMenu();
  if(b.dataset.n !== project) switchTo(b.dataset.n);
};
$('projname').onkeydown = e => {
  if(e.key === 'Enter'){ e.preventDefault(); renameTo($('projname').value); }
  if(e.key === 'Escape') closeProjMenu();
};
$('projrename').onclick = () => renameTo($('projname').value);
// New project opens a blank project immediately and drops you into rename.
$('newp').onclick = async () => {
  const r = await jpost('/projects', {name: await uniqueProjectName()});
  await switchTo(r.name);
  openProjMenu();
};
document.addEventListener('click', e => {
  if(!e.target.closest('.proj')) closeProjMenu();
});

/* ---------- reference clips (frames corpus + uploaded refs) ---------- */
async function loadRefs(){
  const [{videos: v}, {refs: r}] = await Promise.all([api('/frames'), api('/refs?project='+encodeURIComponent(project))]);
  videos = v || [];
  const items = [];
  for(const vid of videos){
    for(const f of vid.frames) items.push({kind:'frame', name:`${vid.video}/${f}`, label:f.replace(/\.\w+$/,'').replace(/^\d+_/,'')});
  }
  for(const f of r) items.push({kind:'ref', name:f, label:f.replace(/\.\w+$/,'')});
  $('rail').innerHTML = items.map(it =>
    `<div class="cl" draggable="true" data-kind="${it.kind}" data-name="${it.name.replace(/"/g,'&quot;')}"
        title="${it.name}"><img loading="lazy" src="${imgURL(it.kind,it.name)}" alt="">
       <span class="cln">${it.label}</span>
       ${it.kind==='ref'?`<button class="rm" data-rm="${it.name.replace(/"/g,'&quot;')}">&times;</button>`:''}</div>`).join('')
    + `<button class="addclip" id="addclip" title="Add image from disk">+</button>`;
}
$('rail').onclick = e => {
  if(e.target.id === 'addclip' || e.target.closest('#addclip')){ $('file').click(); return; }
  const rm = e.target.closest('.rm');
  if(rm){ e.stopPropagation(); removeRef(rm.dataset.rm); return; }
  const c = e.target.closest('.cl'); if(!c) return;
  useAsRef(c.dataset.kind, c.dataset.name);
};
async function removeRef(name){
  try{ await fetch(`/api/img?kind=ref&project=${encodeURIComponent(project)}&name=${encodeURIComponent(name)}`, {method:'DELETE'}); }
  catch{}
  attached = attached.filter(x => x !== name);
  paintAttach(); loadRefs();
}

/* ---------- selection (attached references) ---------- */
function paintAttach(){
  const thumbs = attached.map((n,i) =>
    `<div class="att" title="${n}"><img src="${imgURL('ref',n)}" alt="" data-n="${n}">
       <b class="idx">${i+1}</b><button class="x" data-x="${n}">&times;</button></div>`).join('');
  const chip = stylePreset ? `<span class="chipstyle">${stylePreset}<button id="rmstyle">&times;</button></span>` : '';
  $('attach').innerHTML =
    `<div class="attcap"><span>FOR THIS SHOT</span><span>${attached.length}/2 refs</span></div>`
    + thumbs + chip;
}
$('attach').onclick = e => {
  const x = e.target.closest('[data-x]');
  if(x){ attached = attached.filter(n => n !== x.dataset.x); return paintAttach(); }
  if(e.target.id === 'rmstyle'){ stylePreset = null; return paintAttach(); }
  const im = e.target.closest('img');
  if(im) openLightbox('ref', im.dataset.n, '', im.dataset.n);
};

async function attach(files){
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if(!list.length) return;
  $('hint').textContent = `adding ${list.length} reference${list.length>1?'s':''}…`;
  for(const f of list){
    try{
      const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
      const {name} = await jpost('/upload', {project, name: f.name, data});
      if(!attached.includes(name)) attached.push(name);
    }catch(err){ $('hint').textContent = String(err); paintAttach(); return; }
  }
  $('hint').textContent = attached.length > 2
    ? `${attached.length} references — the model uses the first 2` : '';
  paintAttach(); loadRefs();
}
$('file').onchange = e => { attach(e.target.files); e.target.value = ''; };
window.addEventListener('paste', e => { if(e.clipboardData?.files?.length) attach(e.clipboardData.files); });

/* turn any image into a real reference: click, drag, or right-click */
async function useAsRef(kind, name){
  try{
    const blob = await fetch(imgURL(kind,name)).then(r => r.blob());
    const data = await new Promise(r => { const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
    const up = await jpost('/upload', {project, name: base(name), data});
    if(!attached.includes(up.name)) attached.push(up.name);
    paintAttach();
    $('hint').textContent = attached.length > 2
      ? `${attached.length} references — the model uses the first 2`
      : `${up.name} added as reference`;
  }catch(err){ $('hint').textContent = String(err); }
}

/* ---------- drag & drop (shots, clips, files) ---------- */
function setDrag(e, payload){
  e.dataTransfer.setData('application/x-studio', JSON.stringify(payload));
  e.dataTransfer.setData('text/plain', payload.name);
  e.dataTransfer.effectAllowed = 'copy';
  const ghost = document.createElement('div');
  ghost.className = 'ghost'; ghost.textContent = 'add as reference';
  document.body.appendChild(ghost);
  e.dataTransfer.setDragImage(ghost, 40, 8);
  requestAnimationFrame(() => ghost.remove());
}
['dragover','drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));
let depth = 0;
function wireDrop(el){
  ['dragenter','dragover'].forEach(ev => el.addEventListener(ev, e => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    if(ev === 'dragenter' && ++depth === 1) $('drop').classList.add('on');
  }));
  el.addEventListener('dragleave', () => { if(--depth <= 0){ depth = 0; $('drop').classList.remove('on'); } });
  el.addEventListener('drop', e => {
    e.preventDefault(); depth = 0; $('drop').classList.remove('on');
    let payload = null;
    try{ payload = JSON.parse(e.dataTransfer.getData('application/x-studio') || 'null'); }catch{}
    if(payload && payload.name) return useAsRef(payload.kind || 'shot', payload.name);
    if(e.dataTransfer.files?.length) attach(e.dataTransfer.files);
  });
}
wireDrop($('main'));
wireDrop($('dock'));

/* ---------- gallery ---------- */
async function loadShots(){
  shots = (await api('/shots?project='+encodeURIComponent(project))).shots;
  render();
}
function render(working, error){
  const f = $('feedin');
  if(!shots.length && !working && !error){
    f.innerHTML = `<div class="blank"><p>No shots yet — describe a beat below,
      or grab a <b>reference clip</b> below to steer the look.</p></div>`;
    return;
  }
  const cells = shots.map(s =>
    `<div class="card" data-n="${s.name}" data-p="${encodeURIComponent(s.prompt||'')}" draggable="true">
       <img loading="lazy" src="${imgURL('shot',s.name)}" alt="">
       <div class="acts">
         <button class="acb" data-act="attach" title="Use as reference"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
         <button class="acb" data-act="preview" title="Preview"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
       </div>
       <span class="tag">${s.prompt || s.name}</span></div>`);
  if(working) cells.unshift(`<div class="working"><div class="muted"><div class="spin"></div><span id="el">0.0s</span></div></div>`);
  f.innerHTML = (error?`<div class="err">${error}</div>`:'') + `<div class="grid ${view}">${cells.join('')}</div>`;
}
$('vt').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  view = b.dataset.v; localStorage.setItem('studio.view', view);
  [...$('vt').children].forEach(x => x.classList.toggle('on', x.dataset.v === view));
  render();
};
// Click a shot -> big preview. Hover + attaches. Drag to add.
$('feedin').onclick = e => {
  const act = e.target.closest('.acb');
  const c = e.target.closest('.card');
  if(act && c){ e.stopPropagation(); act.dataset.act === 'preview' ? openLightbox('shot', c.dataset.n, c.dataset.p) : useAsRef('shot', c.dataset.n); return; }
  if(c) openLightbox('shot', c.dataset.n, c.dataset.p);
};
$('feedin').ondblclick = e => { const c = e.target.closest('.card'); if(c) openLightbox('shot', c.dataset.n, c.dataset.p); };
$('feedin').addEventListener('dragstart', e => {
  const c = e.target.closest('.card'); if(!c) return;
  setDrag(e, {kind:'shot', name:c.dataset.n});
  c.classList.add('dragging');
});
$('feedin').addEventListener('dragend', e => { const c = e.target.closest('.card'); if(c) c.classList.remove('dragging'); });
$('rail').addEventListener('dragstart', e => {
  const c = e.target.closest('.cl'); if(!c) return;
  setDrag(e, {kind:c.dataset.kind, name:c.dataset.name});
  c.classList.add('dragging');
});
$('rail').addEventListener('dragend', e => { const c = e.target.closest('.cl'); if(c) c.classList.remove('dragging'); });

/* ---------- lightbox (big preview) ---------- */
function openLightbox(kind, name, promptText, title){
  const s = shots.find(x => x.name === name) || {};
  const pr = title || (promptText ? decodeURIComponent(promptText) : (s.prompt || ''));
  const meta = [s.seed!=null?`seed ${s.seed}`:null, s.secs!=null?`${s.secs}s`:null].filter(Boolean).join(' · ');
  const acts = [];
  if(kind !== 'ref') acts.push(`<button class="lbb prim" data-a="useref"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Use as reference</button>`);
  acts.push(`<a class="lbb" href="${imgURL(kind,name)}" download="${base(name)}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7-7 7 7M5 21h14"/></svg>Download</a>`);
  if(kind !== 'frame') acts.push(`<button class="lbb dngr" data-a="del"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Delete</button>`);
  $('lbin').innerHTML = `
    <img class="lbimg" src="${imgURL(kind,name)}" alt="">
    <div class="lbcap">
      <h3>${base(name)}</h3>
      ${meta?`<div class="lmeta">${meta}</div>`:''}
      ${pr?`<div class="lprompt">${pr}</div>`:''}
      <div class="lbacts">${acts.join('')}</div>
    </div>`;
  $('lb').dataset.kind = kind; $('lb').dataset.name = name;
  $('lb').classList.add('open');
}
$('lb').onclick = e => {
  if(e.target === $('lb') || e.target.classList.contains('lbimg')){ $('lb').classList.remove('open'); return; }
  const b = e.target.closest('[data-a]'); if(!b) return;
  const kind = $('lb').dataset.kind, name = $('lb').dataset.name;
  if(b.dataset.a === 'useref'){ useAsRef(kind, name); $('lb').classList.remove('open'); }
  if(b.dataset.a === 'del'){
    fetch(`/api/img?kind=${kind}&project=${encodeURIComponent(project)}&name=${encodeURIComponent(name)}`, {method:'DELETE'}).catch(()=>{});
    attached = attached.filter(x => x !== name);
    paintAttach(); loadShots(); loadRefs(); $('lb').classList.remove('open');
  }
};
$('lbin').onclick = e => { if(e.target.closest('a')) e.stopPropagation(); };

/* ---------- right-click menu ---------- */
const menu = $('menu');
function openMenu(x, y, items){
  menu.innerHTML = items.map(i => i.sep ? '<div class="msep"></div>'
    : `<div class="mi${i.dngr?' dngr':''}" data-a="${i.a}">${i.t}${i.k?`<span>${i.k}</span>`:''}</div>`).join('');
  menu.style.left = Math.min(x, innerWidth-220)+'px';
  menu.style.top  = Math.min(y, innerHeight-240)+'px';
  menu.classList.add('on');
}
document.addEventListener('click', () => menu.classList.remove('on'));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ menu.classList.remove('on'); $('lb').classList.remove('open'); closeProjMenu(); }
});
document.addEventListener('contextmenu', e => {
  const card = e.target.closest('.card'), cl = e.target.closest('.cl'), att = e.target.closest('.att');
  if(!card && !cl && !att) return;
  e.preventDefault();
  if(card){
    menu.dataset.kind='shot'; menu.dataset.n=card.dataset.n; menu.dataset.p=card.dataset.p;
    openMenu(e.clientX, e.clientY, [
      {a:'useref', t:'Use as reference'}, {a:'reuse', t:'Reuse prompt'}, {sep:1},
      {a:'download', t:'Download'}, {a:'open', t:'Open'}, {a:'del', t:'Delete', dngr:1},
    ]);
  }else if(cl){
    menu.dataset.kind=cl.dataset.kind; menu.dataset.n=cl.dataset.name; menu.dataset.p='';
    const items = [{a:'useref', t:'Use as reference'}, {sep:1}, {a:'download', t:'Download'}, {a:'open', t:'Open'}];
    if(cl.dataset.kind === 'ref') items.push({sep:1}, {a:'del', t:'Remove', dngr:1});
    openMenu(e.clientX, e.clientY, items);
  }else{
    menu.dataset.kind='ref'; menu.dataset.n=att.querySelector('img').dataset.n; menu.dataset.p='';
    openMenu(e.clientX, e.clientY, [{a:'open', t:'Open'}, {a:'download', t:'Download'}, {sep:1}, {a:'detach', t:'Remove from shot', dngr:1}]);
  }
});
menu.onclick = async e => {
  const mi = e.target.closest('.mi'); if(!mi) return;
  const a = mi.dataset.a, kind = menu.dataset.kind, n = menu.dataset.n;
  const pr = decodeURIComponent(menu.dataset.p||'');
  menu.classList.remove('on');
  if(a.startsWith('style:')){ stylePreset = a.slice(6); return paintAttach(); }
  if(a === 'reuse'){ const ta=$('p'); ta.value = pr; ta.focus(); ta.dispatchEvent(new Event('input')); return; }
  if(a === 'open'){ return openLightbox(kind, n, pr); }
  if(a === 'download'){
    const link = document.createElement('a');
    link.href = imgURL(kind,n); link.download = base(n); link.click(); return;
  }
  if(a === 'detach'){ attached = attached.filter(x => x !== n); return paintAttach(); }
  if(a === 'useref'){ return useAsRef(kind, n); }
  if(a === 'del'){
    await fetch(`/api/img?kind=${kind}&project=${encodeURIComponent(project)}&name=${encodeURIComponent(n)}`, {method:'DELETE'}).catch(()=>{});
    attached = attached.filter(x => x !== n);
    paintAttach(); loadShots(); loadRefs();
  }
};

/* ---------- preset styles ---------- */
$('stylebtn').onclick = e => {
  e.stopPropagation();
  openMenu(e.clientX, e.clientY, Object.keys(presets).map(k => ({a:'style:'+k, t:k})));
};

/* ---------- generate ---------- */
const ta = $('p');
ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; });
ta.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('go').click(); }});
$('go').onclick = async () => {
  const txt = ta.value.trim(); if(!txt) return ta.focus();
  const [w,h] = $('ratio').value.split('x').map(Number);
  busy = true; $('go').disabled = true; render(true);
  const t0 = Date.now();
  const tick = setInterval(()=>{ const el=$('el'); if(el) el.textContent=((Date.now()-t0)/1000).toFixed(1)+'s'; },100);
  try{
    const r = await jpost('/generate',{prompt:txt, project, preset:stylePreset, width:w, height:h,
      steps:+$('steps').value, seed:-1, ref_paths:attached});
    $('hint').textContent = `${r.generate_s}s · seed ${r.seed}`
      + (r.refs_dropped ? ` · ${r.refs_dropped} reference ignored (model takes 2)` : '');
    ta.value=''; ta.style.height='auto';
    await loadShots();
    $('feed').scrollTo({top:0,behavior:'smooth'});
  }catch(e){ render(false, typeof e==='string'?e:JSON.stringify(e)); $('hint').textContent=''; }
  finally{ clearInterval(tick); busy=false; $('go').disabled=false; }
};

/* ---------- boot ---------- */
(async () => {
  try{ presets = (await api('/config')).presets || {}; }catch{}
  [...$('vt').children].forEach(x => x.classList.toggle('on', x.dataset.v === view));
  await loadProjects(); await loadRefs(); paintAttach(); await loadShots();
})();
poll(); setInterval(poll, 5000);
</script>

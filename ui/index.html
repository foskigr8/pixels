<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>
<style>
/* Committed dark surface, like the reference. Every colour is painted
   explicitly so the page holds on any host background. */
:root{
  --bg:#06060b; --glow:#181a3a;
  --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f1f1f6; --dim:#8b8b9c; --dim2:#5f5f6e;
  --a1:#6366f1; --a2:#a78bfa;
  --ok:#4ade80; --bad:#f87171;
  --r:18px; --rs:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font:400 14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
/* ambient glow, the one atmospheric flourish */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(58% 42% at 50% -8%, rgba(99,102,241,.20), transparent 70%),
    radial-gradient(40% 30% at 88% 8%, rgba(167,139,250,.10), transparent 70%);}
.app{position:relative;z-index:1;display:grid;grid-template-columns:264px 1fr;gap:14px;height:100vh;padding:14px}

/* ---------- sidebar ---------- */
.side{background:var(--card);border:1px solid var(--line);border-radius:24px;
  padding:22px 16px;display:flex;flex-direction:column;gap:26px;backdrop-filter:blur(20px)}
.logo{display:flex;align-items:center;gap:11px;padding:0 8px}
.mark{width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#c7d2fe,#6366f1 45%,#312e81);
  box-shadow:0 0 18px rgba(99,102,241,.5)}
.logo h1{font-size:19px;font-weight:600;letter-spacing:-.02em}
nav{display:flex;flex-direction:column;gap:3px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--rs);
  color:var(--dim);cursor:pointer;font-size:14px;font-weight:500;
  border:1px solid transparent;transition:.16s;user-select:none}
.nav:hover{color:var(--text);background:var(--card)}
.nav.on{color:var(--text);background:var(--card2);border-color:var(--line2)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.spacer{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:13px 14px}
.prow{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:7px}
.prow:last-child{margin-bottom:0}
.prow span{color:var(--dim)}
.prow b{font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:99px;background:rgba(74,222,128,.13);color:var(--ok)}
.pill.bad{background:rgba(248,113,113,.13);color:var(--bad)}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}

/* ---------- main ---------- */
.main{overflow-y:auto;overflow-x:hidden;padding:34px 34px 60px;scrollbar-width:thin}
.wrap{max-width:1120px;margin:0 auto}
.hero{text-align:center;margin-bottom:30px}
.hero h2{font-size:clamp(30px,3.6vw,50px);font-weight:300;line-height:1.14;
  letter-spacing:-.028em;text-wrap:balance;color:#c9c9d6}
.hero h2 b{font-weight:700;color:#fff}
.hero p{color:var(--dim);margin-top:12px;font-size:15px}

/* prompt bar */
.bar{display:flex;align-items:center;gap:10px;padding:9px 9px 9px 10px;
  background:rgba(255,255,255,.045);border:1px solid var(--line2);border-radius:99px;
  backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,0,.5);transition:border-color .18s}
.bar:focus-within{border-color:rgba(129,140,248,.55)}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:.16s;overflow:hidden}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}
.iconbtn.has{border-color:var(--a2);padding:0}
.iconbtn img{width:100%;height:100%;object-fit:cover}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
#prompt{flex:1;background:0;border:0;outline:0;color:var(--text);font:inherit;
  padding:8px 4px;resize:none;max-height:96px;line-height:1.5}
#prompt::placeholder{color:var(--dim2)}
.opt{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:13px;
  font-weight:500;cursor:pointer;white-space:nowrap;transition:.16s}
.opt:hover{color:var(--text);border-color:var(--line2)}
.opt svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.opt select{appearance:none;background:0;border:0;color:inherit;font:inherit;outline:0;cursor:pointer}
.opt select option{background:#14141c;color:var(--text)}
.send{width:46px;height:46px;flex:none;border:0;border-radius:50%;cursor:pointer;
  background:linear-gradient(145deg,var(--a2),var(--a1));display:grid;place-items:center;
  box-shadow:0 4px 22px rgba(99,102,241,.55);transition:.16s}
.send:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 26px rgba(99,102,241,.7)}
.send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.send svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.1}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px}
.chip{padding:9px 17px;border-radius:99px;background:var(--card);border:1px solid var(--line);
  color:var(--dim);font-size:13px;font-weight:500;cursor:pointer;transition:.16s;user-select:none}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.on{color:#fff;border-color:rgba(129,140,248,.65);background:rgba(99,102,241,.16);
  box-shadow:0 0 18px rgba(99,102,241,.28)}

/* reference drawer */
.drawer{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:none}
.drawer.open{display:block}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.dhead select{background:var(--card2);border:1px solid var(--line);border-radius:9px;
  color:var(--text);padding:8px 11px;font:inherit;font-size:13px;outline:0}
.dhead select option{background:#14141c}
.link{background:0;border:0;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
.link:hover{color:var(--text)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;
  max-height:210px;overflow-y:auto}
.thumb{aspect-ratio:16/9;border-radius:9px;overflow:hidden;cursor:pointer;
  border:2px solid transparent;background:var(--card2);transition:.14s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{border-color:var(--line2)}
.thumb.on{border-color:var(--a2);box-shadow:0 0 14px rgba(167,139,250,.4)}

/* results */
.sec{margin-top:42px}
.sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sechead h3{font-size:19px;font-weight:600;letter-spacing:-.015em;position:relative;padding-bottom:9px}
.sechead h3::after{content:"";position:absolute;left:0;bottom:0;width:34px;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--a2),transparent)}
.stage{border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  min-height:290px;display:grid;place-items:center;overflow:hidden;padding:14px}
.stage img{max-width:100%;max-height:60vh;border-radius:var(--rs);display:block}
.muted{color:var(--dim2);font-size:14px;text-align:center}
.spin{width:30px;height:30px;border:2.5px solid var(--line2);border-top-color:var(--a2);
  border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 13px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.err{color:#fca5a5;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.28);
  padding:15px 17px;border-radius:var(--rs);font-size:13px;white-space:pre-wrap;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{position:relative;aspect-ratio:16/9;border-radius:var(--rs);overflow:hidden;cursor:pointer;
  background:var(--card2);border:1px solid var(--line);transition:.16s}
.card:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.card .tag{position:absolute;left:9px;bottom:9px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);
  color:#fff;font-variant-numeric:tabular-nums;opacity:0;transition:.16s}
.card:hover .tag{opacity:1}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}.card:first-child{grid-column:span 2;grid-row:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark"></div><h1>Studio</h1></div>
    <nav>
      <div class="nav on" data-v="create">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>Create</div>
      <div class="nav" data-v="shots">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Shots</div>
      <div class="nav" data-v="refs">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Reference</div>
    </nav>
    <div class="spacer"></div>
    <div class="panel">
      <div class="prow"><span>Model</span><span class="pill" id="pill"><i></i><b id="pilltx">…</b></span></div>
      <div class="prow"><span>VRAM free</span><b id="vram">—</b></div>
      <div class="prow"><span>Median</span><b id="med">—</b></div>
      <div class="prow"><span>Shots</span><b id="count">0</b></div>
    </div>
    <div class="panel" style="display:flex;align-items:center;gap:11px">
      <div class="mark" style="width:26px;height:26px;box-shadow:none"></div>
      <div style="font-size:13px;font-weight:600">Krea 2 Turbo</div>
    </div>
  </aside>

  <main class="main">
    <div class="wrap">
      <div class="hero">
        <h2>Every shot, <b>one style.</b></h2>
        <p>Describe the beat. The house style is already loaded.</p>
      </div>

      <div class="bar">
        <button class="iconbtn" id="refbtn" title="Reference image" aria-label="Choose reference image">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>
        </button>
        <textarea id="prompt" rows="1" placeholder="Describe the shot — a stickman sweating beside a desk fan…"></textarea>
        <div class="opt">
          <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/></svg>
          <select id="ratio">
            <option value="1024x576">16:9</option><option value="576x1024">9:16</option>
            <option value="1024x1024">1:1</option><option value="1024x768">4:3</option>
          </select>
        </div>
        <div class="opt" title="Sampling steps">
          <svg viewBox="0 0 24 24"><path d="M13 2 4.5 13H11l-1 9 8.5-11H12z"/></svg>
          <select id="steps"><option>6</option><option selected>8</option><option>12</option><option>16</option></select>
        </div>
        <button class="send" id="go" aria-label="Generate">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>

      <div class="chips" id="chips"></div>

      <div class="drawer" id="drawer">
        <div class="dhead">
          <select id="video"></select>
          <button class="link" id="clearref">clear selection</button>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>

      <div class="sec">
        <div class="sechead"><h3>Result</h3><div class="muted" id="meta"></div></div>
        <div class="stage" id="stage"><div class="muted">Your shot appears here</div></div>
      </div>

      <div class="sec">
        <div class="sechead"><h3>Recent</h3><button class="link" id="refresh">refresh</button></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </main>
</div>

<script>
const $ = i => document.getElementById(i);
let ref = null, preset = null, busy = false;

const api = (p, o) => fetch('/api' + p, o).then(r =>
  r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail || r.statusText), () => Promise.reject(r.statusText)));

/* ---------- status ---------- */
async function poll(){
  try{
    const h = await api('/health');
    const up = h.status === 'ready';
    $('pill').className = 'pill' + (up ? '' : ' bad');
    $('pilltx').textContent = up ? 'ready' : 'loading';
    $('vram').textContent = h.vram_free_gb ? h.vram_free_gb + ' GB' : '—';
    $('count').textContent = h.generated ?? 0;
    $('go').disabled = !up || busy;
    const s = await api('/stats');
    $('med').textContent = s.n ? s.median_s + 's' : '—';
  }catch{
    $('pill').className = 'pill bad'; $('pilltx').textContent = 'offline';
    $('go').disabled = true;
  }
}

/* ---------- init ---------- */
async function init(){
  const c = await api('/config');
  $('chips').innerHTML = Object.keys(c.presets)
    .map(k => `<div class="chip" data-k="${k}">${k}</div>`).join('');
  $('chips').onclick = e => {
    const el = e.target.closest('.chip'); if(!el) return;
    preset = preset === el.dataset.k ? null : el.dataset.k;
    [...$('chips').children].forEach(x => x.classList.toggle('on', x.dataset.k === preset));
  };
  $('video').innerHTML = c.videos.map(v => `<option>${v}</option>`).join('');
  $('video').onchange = refs;
  if(c.videos.length) refs();
  shots();
}

async function refs(){
  const r = await api('/refs?video=' + encodeURIComponent($('video').value));
  $('thumbs').innerHTML = r.refs.map(p =>
    `<div class="thumb${p===ref?' on':''}" data-p="${p}"><img loading="lazy" src="/api/file?path=${encodeURIComponent(p)}" alt=""></div>`).join('');
}
$('thumbs').onclick = e => {
  const t = e.target.closest('.thumb'); if(!t) return;
  ref = ref === t.dataset.p ? null : t.dataset.p;
  [...$('thumbs').children].forEach(x => x.classList.toggle('on', x.dataset.p === ref));
  paintRef();
};
$('clearref').onclick = () => { ref = null;
  [...$('thumbs').children].forEach(x => x.classList.remove('on')); paintRef(); };
$('refbtn').onclick = () => $('drawer').classList.toggle('open');

function paintRef(){
  const b = $('refbtn');
  b.className = 'iconbtn' + (ref ? ' has' : '');
  b.innerHTML = ref
    ? `<img src="/api/file?path=${encodeURIComponent(ref)}" alt="">`
    : `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>`;
}

async function shots(){
  const s = await api('/shots');
  $('grid').innerHTML = s.shots.length
    ? s.shots.map(n => `<div class="card" data-n="${n}"><img loading="lazy" src="/api/shot?name=${encodeURIComponent(n)}" alt=""><span class="tag">${n}</span></div>`).join('')
    : '<div class="muted" style="grid-column:1/-1;padding:34px 0">Nothing generated yet</div>';
}
$('grid').onclick = e => {
  const c = e.target.closest('.card'); if(!c) return;
  $('stage').innerHTML = `<img src="/api/shot?name=${encodeURIComponent(c.dataset.n)}" alt="">`;
};
$('refresh').onclick = shots;

/* ---------- generate ---------- */
const ta = $('prompt');
ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
ta.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('go').click(); } });

$('go').onclick = async () => {
  const p = ta.value.trim(); if(!p) return ta.focus();
  const [w,h] = $('ratio').value.split('x').map(Number);
  busy = true; $('go').disabled = true;
  $('stage').innerHTML = '<div class="muted"><div class="spin"></div>generating…</div>';
  const t0 = Date.now();
  const tick = setInterval(() => $('meta').textContent = ((Date.now()-t0)/1000).toFixed(1)+'s', 100);
  try{
    const r = await api('/generate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt:p, preset, width:w, height:h,
        steps:+$('steps').value, seed:-1, ref_paths: ref?[ref]:[]})});
    $('stage').innerHTML = `<img src="/api/shot?name=${encodeURIComponent(r.name)}&t=${Date.now()}" alt="">`;
    $('meta').textContent = `${r.generate_s}s · seed ${r.seed}`;
    shots();
  }catch(e){
    $('stage').innerHTML = `<div class="err">${typeof e==='string'?e:JSON.stringify(e)}</div>`;
    $('meta').textContent = '';
  }finally{ clearInterval(tick); busy = false; $('go').disabled = false; }
};

/* nav: Reference opens the drawer, Shots jumps to the grid */
document.querySelectorAll('.nav').forEach(n => n.onclick = () => {
  document.querySelectorAll('.nav').forEach(x => x.classList.toggle('on', x === n));
  if(n.dataset.v === 'refs') $('drawer').classList.add('open');
  if(n.dataset.v === 'shots') $('grid').scrollIntoView({behavior:'smooth', block:'start'});
  if(n.dataset.v === 'create') window.scrollTo({top:0}), document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
});

init(); poll(); setInterval(poll, 5000);
</script>
</body>
</html>

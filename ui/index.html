<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>
<style>
:root{
  --bg:#08080b; --s1:rgba(255,255,255,.035); --s2:rgba(255,255,255,.06);
  --ln:rgba(255,255,255,.07); --ln2:rgba(255,255,255,.13);
  --tx:#ededf2; --dm:#7e7e8d; --dm2:#54545f;
  --ac:#6d6df0; --ac2:#9d9dff; --ok:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow:hidden;
  font:400 13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:212px 1fr;height:100vh}

/* ---------- sidebar ---------- */
.side{border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:18px 12px}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 22px}
.mark{width:19px;height:19px;border-radius:6px;
  background:linear-gradient(140deg,var(--ac2),var(--ac));box-shadow:0 0 14px rgba(109,109,240,.45)}
.logo h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
nav{display:flex;flex-direction:column;gap:1px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--dm);
  cursor:pointer;font-size:13px;font-weight:500;transition:.14s;user-select:none}
.nav:hover{color:var(--tx);background:var(--s1)}
.nav.on{color:var(--tx);background:var(--s2)}
.nav svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.cap{font-size:10.5px;font-weight:600;letter-spacing:.09em;color:var(--dm2);padding:22px 10px 8px}
.stylelist{display:flex;flex-direction:column;gap:1px}
.st{padding:7px 10px;border-radius:8px;color:var(--dm);font-size:12.5px;cursor:pointer;
  transition:.14s;user-select:none;display:flex;align-items:center;gap:8px}
.st:hover{color:var(--tx);background:var(--s1)}
.st.on{color:var(--tx);background:var(--s2)}
.st i{width:4px;height:4px;border-radius:50%;background:var(--dm2);flex:none}
.st.on i{background:var(--ac2);box-shadow:0 0 7px var(--ac2)}
.grow{flex:1}
.stat{display:flex;align-items:center;gap:7px;padding:9px 10px;font-size:11.5px;color:var(--dm);
  border-top:1px solid var(--ln);margin-top:14px;font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dm2);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--bad)}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.feed{flex:1;overflow-y:auto;padding:26px 28px 8px;scrollbar-width:thin}
.feedin{max-width:1180px;margin:0 auto}
.blank{height:100%;display:grid;place-items:center;text-align:center}
.blank h2{font-size:26px;font-weight:300;letter-spacing:-.02em;color:#b9b9c8}
.blank h2 b{font-weight:650;color:#fff}
.blank p{color:var(--dm2);margin-top:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{position:relative;aspect-ratio:16/9;border-radius:11px;overflow:hidden;cursor:zoom-in;
  background:var(--s1);border:1px solid var(--ln);transition:.16s}
.card:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover{border-color:var(--ln2)}
.card .tag{position:absolute;left:8px;bottom:8px;right:8px;display:flex;justify-content:space-between;
  gap:8px;font-size:10.5px;font-weight:600;color:#fff;opacity:0;transition:.16s;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.card:hover .tag{opacity:1}
.working{grid-column:span 2;grid-row:span 2;border-radius:11px;border:1px solid var(--ln);
  background:var(--s1);display:grid;place-items:center;min-height:220px}
.spin{width:26px;height:26px;border:2.5px solid var(--ln2);border-top-color:var(--ac2);
  border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 11px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.muted{color:var(--dm2);font-size:12.5px;text-align:center;font-variant-numeric:tabular-nums}
.err{margin:0 auto;max-width:620px;color:#fca5a5;background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.25);padding:13px 15px;border-radius:11px;
  font-size:12.5px;white-space:pre-wrap}

/* ---------- composer ---------- */
.dock{padding:10px 28px 22px;position:relative}
.dockin{max-width:900px;margin:0 auto;position:relative}
.bar{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 8px;
  background:rgba(20,20,26,.9);border:1px solid var(--ln2);border-radius:22px;
  backdrop-filter:blur(24px);box-shadow:0 10px 42px rgba(0,0,0,.55);transition:border-color .16s}
.bar:focus-within{border-color:rgba(157,157,255,.45)}
.ib{width:36px;height:36px;flex:none;border-radius:11px;border:1px solid var(--ln);
  background:var(--s1);color:var(--dm);display:grid;place-items:center;cursor:pointer;
  transition:.14s;overflow:hidden;padding:0}
.ib:hover{color:var(--tx);border-color:var(--ln2)}
.ib.has{border-color:var(--ac2)}
.ib img{width:100%;height:100%;object-fit:cover}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
#p{flex:1;background:0;border:0;outline:0;color:var(--tx);font:inherit;resize:none;
  padding:9px 4px;max-height:132px;line-height:1.5}
#p::placeholder{color:var(--dm2)}
.opt{display:flex;align-items:center;height:36px;padding:0 4px 0 10px;border-radius:11px;
  background:var(--s1);border:1px solid var(--ln);color:var(--dm);font-size:12px;
  font-weight:500;transition:.14s}
.opt:hover{color:var(--tx);border-color:var(--ln2)}
.opt select{appearance:none;background:0;border:0;color:inherit;font:inherit;outline:0;
  cursor:pointer;padding:0 6px}
.opt select option{background:#14141a;color:var(--tx)}
.send{width:36px;height:36px;flex:none;border:0;border-radius:11px;cursor:pointer;
  background:linear-gradient(145deg,var(--ac2),var(--ac));display:grid;place-items:center;transition:.14s}
.send:hover:not(:disabled){filter:brightness(1.12)}
.send:disabled{opacity:.35;cursor:not-allowed}
.send svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2}
.hint{text-align:center;font-size:11px;color:var(--dm2);margin-top:9px;
  font-variant-numeric:tabular-nums;min-height:14px}

/* reference popover, opens upward from the button */
.pop{position:absolute;left:0;bottom:calc(100% + 9px);width:min(560px,100%);
  background:rgba(18,18,24,.97);border:1px solid var(--ln2);border-radius:15px;padding:13px;
  backdrop-filter:blur(24px);box-shadow:0 18px 50px rgba(0,0,0,.65);display:none;z-index:20}
.pop.open{display:block}
.pophead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.pophead select{flex:1;background:var(--s1);border:1px solid var(--ln);border-radius:9px;
  color:var(--tx);padding:7px 9px;font:inherit;font-size:12px;outline:0}
.pophead select option{background:#14141a}
.lk{background:0;border:0;color:var(--dm);font:inherit;font-size:11.5px;cursor:pointer;padding:4px}
.lk:hover{color:var(--tx)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;
  max-height:188px;overflow-y:auto}
.th{aspect-ratio:16/9;border-radius:7px;overflow:hidden;cursor:pointer;border:2px solid transparent;
  background:var(--s2);transition:.14s}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th:hover{border-color:var(--ln2)}
.th.on{border-color:var(--ac2)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,5,8,.94);backdrop-filter:blur(8px);
  display:none;place-items:center;z-index:50;padding:36px;cursor:zoom-out}
.lb.open{display:grid}
.lb img{max-width:100%;max-height:100%;border-radius:11px}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
@media(max-width:880px){.app{grid-template-columns:1fr}.side{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}.card:first-child{grid-column:span 2;grid-row:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark"></div><h1>Studio</h1></div>
    <nav>
      <div class="nav on" data-v="all"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Shots</div>
      <div class="nav" data-v="refs"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>Reference</div>
    </nav>
    <div class="cap">STYLE</div>
    <div class="stylelist" id="styles"></div>
    <div class="grow"></div>
    <div class="stat"><span class="dot" id="dot"></span><span id="stat">connecting</span></div>
  </aside>

  <main class="main">
    <div class="feed" id="feed">
      <div class="feedin" id="feedin">
        <div class="blank"><div>
          <h2>Every shot, <b>one style.</b></h2>
          <p>Describe a beat below. The house style is already applied.</p>
        </div></div>
      </div>
    </div>

    <div class="dock"><div class="dockin">
      <div class="pop" id="pop">
        <div class="pophead">
          <select id="video"></select>
          <button class="lk" id="clr">clear</button>
          <button class="lk" id="close">close</button>
        </div>
        <div class="strip" id="strip"></div>
      </div>

      <div class="bar">
        <button class="ib" id="refbtn" title="Reference frame" aria-label="Reference frame">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>
        </button>
        <textarea id="p" rows="1" placeholder="a stickman sweating beside a desk fan, blue airflow, red heat lines…"></textarea>
        <div class="opt"><select id="ratio">
          <option value="1024x576">16:9</option><option value="576x1024">9:16</option>
          <option value="1024x1024">1:1</option><option value="1024x768">4:3</option></select></div>
        <div class="opt" title="Steps"><select id="steps">
          <option>6</option><option selected>8</option><option>12</option><option>16</option></select></div>
        <button class="send" id="go" aria-label="Generate">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="hint" id="hint"></div>
    </div></div>
  </main>
</div>
<div class="lb" id="lb"></div>

<script>
const $ = i => document.getElementById(i);
let ref = null, preset = null, busy = false, shots = [];
const api = (p,o) => fetch('/api'+p,o).then(r => r.ok ? r.json()
  : r.json().then(e => Promise.reject(e.detail || r.statusText), () => Promise.reject(r.statusText)));

/* ---------- status ---------- */
async function poll(){
  try{
    const h = await api('/health'), s = await api('/stats');
    const up = h.status === 'ready';
    $('dot').className = 'dot ' + (up ? 'ok' : '');
    $('stat').textContent = up
      ? [h.vram_free_gb ? h.vram_free_gb+' GB free' : null, s.n ? 'median '+s.median_s+'s' : null]
          .filter(Boolean).join(' · ') || 'ready'
      : 'loading model…';
    $('go').disabled = !up || busy;
  }catch{
    $('dot').className='dot bad'; $('stat').textContent='server offline'; $('go').disabled=true;
  }
}

/* ---------- init ---------- */
async function init(){
  const c = await api('/config');
  $('styles').innerHTML = Object.keys(c.presets)
    .map(k => `<div class="st" data-k="${k}"><i></i>${k}</div>`).join('');
  $('styles').onclick = e => {
    const el = e.target.closest('.st'); if(!el) return;
    preset = preset === el.dataset.k ? null : el.dataset.k;
    [...$('styles').children].forEach(x => x.classList.toggle('on', x.dataset.k === preset));
  };
  $('video').innerHTML = c.videos.map(v => `<option>${v}</option>`).join('');
  $('video').onchange = loadRefs;
  if(c.videos.length) loadRefs();
  loadShots();
}

async function loadRefs(){
  const r = await api('/refs?video=' + encodeURIComponent($('video').value));
  $('strip').innerHTML = r.refs.map(p =>
    `<div class="th${p===ref?' on':''}" data-p="${p}"><img loading="lazy" src="/api/file?path=${encodeURIComponent(p)}" alt=""></div>`).join('');
}
$('strip').onclick = e => {
  const t = e.target.closest('.th'); if(!t) return;
  ref = ref === t.dataset.p ? null : t.dataset.p;
  [...$('strip').children].forEach(x => x.classList.toggle('on', x.dataset.p === ref));
  paintRef();
};
const closePop = () => $('pop').classList.remove('open');
$('refbtn').onclick = e => { e.stopPropagation(); $('pop').classList.toggle('open'); };
$('close').onclick = closePop;
$('clr').onclick = () => { ref=null; [...$('strip').children].forEach(x=>x.classList.remove('on')); paintRef(); };
document.addEventListener('click', e => { if(!e.target.closest('.pop')) closePop(); });

function paintRef(){
  const b = $('refbtn');
  b.className = 'ib' + (ref ? ' has' : '');
  b.innerHTML = ref ? `<img src="/api/file?path=${encodeURIComponent(ref)}" alt="">`
    : `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>`;
}

/* ---------- feed ---------- */
async function loadShots(){ shots = (await api('/shots')).shots; render(); }

function render(working, error){
  const f = $('feedin');
  if(!shots.length && !working && !error){
    f.innerHTML = `<div class="blank"><div><h2>Every shot, <b>one style.</b></h2>
      <p>Describe a beat below. The house style is already applied.</p></div></div>`;
    return;
  }
  const cells = shots.map(n =>
    `<div class="card" data-n="${n}"><img loading="lazy" src="/api/shot?name=${encodeURIComponent(n)}" alt="">
     <span class="tag"><span>${n}</span></span></div>`);
  if(working) cells.unshift(`<div class="working"><div class="muted"><div class="spin"></div><span id="el">0.0s</span></div></div>`);
  f.innerHTML = (error ? `<div class="err">${error}</div>` : '') + `<div class="grid">${cells.join('')}</div>`;
}
$('feedin').onclick = e => {
  const c = e.target.closest('.card'); if(!c) return;
  $('lb').innerHTML = `<img src="/api/shot?name=${encodeURIComponent(c.dataset.n)}" alt="">`;
  $('lb').classList.add('open');
};
$('lb').onclick = () => $('lb').classList.remove('open');
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ $('lb').classList.remove('open'); closePop(); } });

/* ---------- generate ---------- */
const ta = $('p');
ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; });
ta.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('go').click(); }});

$('go').onclick = async () => {
  const txt = ta.value.trim(); if(!txt) return ta.focus();
  const [w,h] = $('ratio').value.split('x').map(Number);
  busy = true; $('go').disabled = true; closePop();
  render(true);
  const t0 = Date.now();
  const tick = setInterval(() => { const el=$('el'); if(el) el.textContent=((Date.now()-t0)/1000).toFixed(1)+'s'; }, 100);
  try{
    const r = await api('/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:txt,preset,width:w,height:h,steps:+$('steps').value,seed:-1,
                           ref_paths: ref?[ref]:[]})});
    $('hint').textContent = `${r.generate_s}s · seed ${r.seed}`;
    ta.value=''; ta.style.height='auto';
    await loadShots();
    $('feed').scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    render(false, typeof e==='string' ? e : JSON.stringify(e));
    $('hint').textContent='';
  }finally{ clearInterval(tick); busy=false; $('go').disabled=false; }
};

document.querySelectorAll('.nav').forEach(n => n.onclick = () => {
  document.querySelectorAll('.nav').forEach(x => x.classList.toggle('on', x===n));
  if(n.dataset.v==='refs') $('pop').classList.add('open');
  else { closePop(); $('feed').scrollTo({top:0,behavior:'smooth'}); }
});

init(); poll(); setInterval(poll, 5000);
</script>
</body>
</html>

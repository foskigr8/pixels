<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>
<style>
:root{
  --bg:#08080b; --s1:rgba(255,255,255,.035); --s2:rgba(255,255,255,.06);
  --ln:rgba(255,255,255,.07); --ln2:rgba(255,255,255,.13);
  --tx:#ededf2; --dm:#7e7e8d; --dm2:#54545f;
  --ac:#6d6df0; --ac2:#9d9dff; --ok:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow:hidden;
  font:400 13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:216px 1fr;height:100vh}

/* ---------- sidebar ---------- */
.side{border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:18px 12px;min-width:0}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 18px}
.mark{width:19px;height:19px;border-radius:6px;
  background:linear-gradient(140deg,var(--ac2),var(--ac));box-shadow:0 0 14px rgba(109,109,240,.45)}
.logo h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.newbtn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;border-radius:9px;
  background:var(--s2);border:1px solid var(--ln2);color:var(--tx);font:inherit;font-size:13px;
  font-weight:500;cursor:pointer;transition:.14s}
.newbtn:hover{background:rgba(109,109,240,.16);border-color:var(--ac)}
.newbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.cap{font-size:10.5px;font-weight:600;letter-spacing:.09em;color:var(--dm2);padding:20px 10px 7px}
.plist{display:flex;flex-direction:column;gap:1px;overflow-y:auto;min-height:0}
.pj{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;
  border-radius:8px;color:var(--dm);font-size:13px;cursor:pointer;transition:.14s;user-select:none}
.pj:hover{color:var(--tx);background:var(--s1)}
.pj.on{color:var(--tx);background:var(--s2)}
.pj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj b{font-size:11px;font-weight:600;color:var(--dm2);font-variant-numeric:tabular-nums;flex:none}
.grow{flex:1;min-height:8px}
.stat{display:flex;align-items:center;gap:7px;padding:9px 10px;font-size:11.5px;color:var(--dm);
  border-top:1px solid var(--ln);font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dm2);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--bad)}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:14px;padding:16px 26px 12px;border-bottom:1px solid var(--ln)}
.top h2{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:none}
.refrail{display:flex;align-items:center;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px}
.refrail::-webkit-scrollbar{height:0}
.rf{position:relative;width:60px;height:34px;border-radius:7px;overflow:hidden;flex:none;
  border:2px solid transparent;cursor:pointer;background:var(--s2);transition:.14s}
.rf img{width:100%;height:100%;object-fit:cover;display:block}
.rf:hover{border-color:var(--ln2)}
.rf.on{border-color:var(--ac2)}
.rf .n{position:absolute;top:2px;right:3px;font-size:9px;font-weight:700;color:#fff;
  background:var(--ac);border-radius:99px;padding:0 4px;display:none}
.rf.on .n{display:block}
.addref{width:60px;height:34px;border-radius:7px;border:1px dashed var(--ln2);background:0;
  color:var(--dm2);display:grid;place-items:center;cursor:pointer;flex:none;transition:.14s}
.addref:hover{color:var(--tx);border-color:var(--ac2)}
.addref svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.emptyref{font-size:11.5px;color:var(--dm2)}

.feed{flex:1;overflow-y:auto;padding:22px 26px 8px;scrollbar-width:thin}
.feedin{max-width:1180px;margin:0 auto}
.blank{padding:14vh 0;text-align:center}
.blank h2{font-size:25px;font-weight:300;letter-spacing:-.02em;color:#b9b9c8}
.blank h2 b{font-weight:650;color:#fff}
.blank p{color:var(--dm2);margin-top:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{position:relative;aspect-ratio:16/9;border-radius:11px;overflow:hidden;cursor:zoom-in;
  background:var(--s1);border:1px solid var(--ln);transition:.16s}
.card:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover{border-color:var(--ln2)}
.card .tag{position:absolute;left:8px;right:8px;bottom:8px;font-size:10.5px;font-weight:600;
  color:#fff;opacity:0;transition:.16s;text-shadow:0 1px 6px rgba(0,0,0,.9);
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card:hover .tag{opacity:1}
.working{grid-column:span 2;grid-row:span 2;border-radius:11px;border:1px solid var(--ln);
  background:var(--s1);display:grid;place-items:center;min-height:210px}
.spin{width:26px;height:26px;border:2.5px solid var(--ln2);border-top-color:var(--ac2);
  border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 11px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.muted{color:var(--dm2);font-size:12.5px;text-align:center;font-variant-numeric:tabular-nums}
.err{margin:0 auto 12px;max-width:620px;color:#fca5a5;background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.25);padding:13px 15px;border-radius:11px;
  font-size:12.5px;white-space:pre-wrap}

/* ---------- composer ---------- */
.dock{padding:10px 26px 20px;position:relative}
.dockin{max-width:900px;margin:0 auto}
.bar{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 8px;
  background:rgba(20,20,26,.9);border:1px solid var(--ln2);border-radius:22px;
  backdrop-filter:blur(24px);box-shadow:0 10px 42px rgba(0,0,0,.55);transition:border-color .16s}
.bar:focus-within{border-color:rgba(157,157,255,.45)}
.ib{width:36px;height:36px;flex:none;border-radius:11px;border:1px solid var(--ln);
  background:var(--s1);color:var(--dm);display:grid;place-items:center;cursor:pointer;transition:.14s}
.ib:hover{color:var(--tx);border-color:var(--ln2)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
#p{flex:1;background:0;border:0;outline:0;color:var(--tx);font:inherit;resize:none;
  padding:9px 4px;max-height:132px;line-height:1.5}
#p::placeholder{color:var(--dm2)}
.opt{display:flex;align-items:center;height:36px;padding:0 4px 0 10px;border-radius:11px;
  background:var(--s1);border:1px solid var(--ln);color:var(--dm);font-size:12px;font-weight:500}
.opt select{appearance:none;background:0;border:0;color:inherit;font:inherit;outline:0;
  cursor:pointer;padding:0 6px}
.opt select option{background:#14141a;color:var(--tx)}
.send{width:36px;height:36px;flex:none;border:0;border-radius:11px;cursor:pointer;
  background:linear-gradient(145deg,var(--ac2),var(--ac));display:grid;place-items:center;transition:.14s}
.send:hover:not(:disabled){filter:brightness(1.12)}
.send:disabled{opacity:.35;cursor:not-allowed}
.send svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2}
.hint{text-align:center;font-size:11px;color:var(--dm2);margin-top:9px;min-height:14px;
  font-variant-numeric:tabular-nums}


/* attachments live inside the composer, Flow-style */
.attach{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 7px 2px}
.att{position:relative;width:56px;height:56px;border-radius:9px;overflow:hidden;
  border:1px solid var(--ln2);background:var(--s2);flex:none}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att button{position:absolute;top:2px;right:2px;width:16px;height:16px;border:0;border-radius:50%;
  background:rgba(0,0,0,.75);color:#fff;font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center}
.att button:hover{background:var(--bad)}
.att.up{display:grid;place-items:center;color:var(--dm2);font-size:10px}
.chipstyle{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;
  background:rgba(109,109,240,.16);border:1px solid var(--ac);color:var(--ac2);font-size:11.5px;font-weight:600}
.chipstyle button{border:0;background:0;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0}

/* view modes */
.grid.rows{grid-template-columns:1fr}
.grid.rows .card,.grid.rows .card:first-child{grid-column:auto;grid-row:auto;aspect-ratio:16/9}
.grid.list{grid-template-columns:1fr;gap:6px}
.grid.list .card,.grid.list .card:first-child{grid-column:auto;grid-row:auto;aspect-ratio:auto;
  display:grid;grid-template-columns:104px 1fr;align-items:center;gap:13px;padding:7px;cursor:pointer}
.grid.list .card img{height:58px;border-radius:7px}
.grid.list .tag{position:static;opacity:1;text-shadow:none;color:var(--dm);white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vt{display:flex;gap:2px;background:var(--s1);border:1px solid var(--ln);border-radius:9px;padding:2px}
.vt button{width:28px;height:24px;border:0;border-radius:6px;background:0;color:var(--dm2);
  cursor:pointer;display:grid;place-items:center}
.vt button.on{background:var(--s2);color:var(--tx)}
.vt svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}

/* lightbox: large, with a caption */
.lb{display:none;place-items:center;position:fixed;inset:0;z-index:50;padding:28px 28px 20px;
  background:rgba(5,5,8,.96);backdrop-filter:blur(10px);cursor:zoom-out}
.lb.open{display:grid}
.lbin{display:flex;flex-direction:column;gap:12px;max-height:100%;max-width:100%;align-items:center;cursor:default}
.lb img{max-width:min(1500px,94vw);max-height:80vh;border-radius:12px;display:block;
  box-shadow:0 30px 90px rgba(0,0,0,.7)}
.lbcap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
  font-size:12.5px;color:var(--dm);font-variant-numeric:tabular-nums}
.lbcap b{color:var(--tx);font-size:14px;font-weight:600}
.lbcap .pr{color:var(--dm);max-width:760px;text-align:center}
.lbcap a{color:var(--ac2);text-decoration:none;border:1px solid var(--ln2);padding:5px 11px;border-radius:8px}
.lbcap a:hover{background:var(--s2)}

/* ---------- overlays ---------- */
.drop{position:absolute;inset:0;z-index:40;display:none;place-items:center;
  background:rgba(8,8,11,.86);backdrop-filter:blur(6px);border:2px dashed var(--ac2);border-radius:14px;margin:10px}
.drop.on{display:grid}
.drop div{text-align:center;color:var(--ac2);font-size:15px;font-weight:500}
.menu{position:fixed;z-index:60;min-width:186px;background:rgba(20,20,26,.98);
  border:1px solid var(--ln2);border-radius:11px;padding:5px;display:none;
  box-shadow:0 14px 44px rgba(0,0,0,.7);backdrop-filter:blur(20px)}
.menu.on{display:block}
.mi{padding:8px 11px;border-radius:7px;font-size:12.5px;color:var(--tx);cursor:pointer;
  display:flex;justify-content:space-between;gap:14px}
.mi:hover{background:var(--s2)}
.mi.dngr{color:#fca5a5}
.mi span{color:var(--dm2);font-size:11px}
.msep{height:1px;background:var(--ln);margin:4px 6px}
.lb{position:fixed;inset:0;background:rgba(5,5,8,.94);backdrop-filter:blur(8px);display:none;
  place-items:center;z-index:50;padding:36px;cursor:zoom-out}
.lb.open{display:grid}
.lb img{max-width:100%;max-height:100%;border-radius:11px}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
@media(max-width:880px){.app{grid-template-columns:1fr}.side{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}.card:first-child{grid-column:span 2;grid-row:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark"></div><h1>Studio</h1></div>
    <button class="newbtn" id="newp">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New project</button>
    <div class="cap">PROJECTS</div>
    <div class="plist" id="plist"></div>
    <div class="grow"></div>
    <div class="stat"><span class="dot" id="dot"></span><span id="stat">connecting</span></div>
  </aside>

  <main class="main" id="main">
    <div class="top">
      <h2 id="pname">untitled</h2>
      <div style="flex:1"></div>
      <div class="vt" id="vt">
        <button data-v="grid" class="on" title="Grid"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
        <button data-v="rows" title="Rows"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg></button>
        <button data-v="list" title="List"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>

    <div class="feed" id="feed"><div class="feedin" id="feedin"></div></div>

    <div class="dock"><div class="dockin">
      <div class="attach" id="attach"></div>
      <div class="bar">
        <button class="ib" id="clip" title="Add reference images">
          <svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 1 1 5 5L10.5 18a2 2 0 0 1-3-3l8-8"/></svg>
        </button>
        <button class="ib" id="stylebtn" title="Preset style">
          <svg viewBox="0 0 24 24"><path d="m12 3 2.4 6.2L21 11l-6.6 1.8L12 19l-2.4-6.2L3 11l6.6-1.8z"/></svg>
        </button>
        <textarea id="p" rows="1" placeholder="a stickman sweating beside a desk fan, blue airflow, red heat lines…"></textarea>
        <div class="opt"><select id="ratio">
          <option value="1024x576">16:9</option><option value="576x1024">9:16</option>
          <option value="1024x1024">1:1</option><option value="1024x768">4:3</option></select></div>
        <div class="opt" title="Steps"><select id="steps">
          <option>6</option><option selected>8</option><option>12</option><option>16</option></select></div>
        <button class="send" id="go" aria-label="Generate">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="hint" id="hint"></div>
    </div></div>

    <div class="drop" id="drop"><div>Drop images to add as reference</div></div>
  </main>
</div>

<div class="menu" id="menu"></div>
<div class="lb" id="lb"><div class="lbin" id="lbin"></div></div>

<script>
const $ = i => document.getElementById(i);
const api = (p,o) => fetch('/api'+p,o).then(r => r.ok ? r.json()
  : r.json().then(e => Promise.reject(e.detail||r.statusText), () => Promise.reject(r.statusText)));
const jpost = (p,b) => api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const imgURL = (kind,name) => `/api/img?kind=${kind}&project=${encodeURIComponent(project)}&name=${encodeURIComponent(name)}`;

let project = localStorage.getItem('studio.project') || 'untitled';
let attached = [];                  // reference filenames attached to the composer
let stylePreset = null, presets = {};
let shots = [], busy = false;
let view = localStorage.getItem('studio.view') || 'grid';

/* ---------- status ---------- */
async function poll(){
  try{
    const h = await api('/health'), s = await api('/stats');
    const up = h.status === 'ready';
    $('dot').className = 'dot ' + (up ? 'ok' : '');
    $('stat').textContent = up
      ? [h.vram_free_gb ? h.vram_free_gb+' GB free' : null, s.n ? 'median '+s.median_s+'s' : null]
        .filter(Boolean).join(' · ') || 'ready'
      : 'loading model…';
    $('go').disabled = !up || busy;
  }catch{ $('dot').className='dot bad'; $('stat').textContent='server offline'; $('go').disabled=true; }
}

/* ---------- projects ---------- */
async function loadProjects(){
  const {projects} = await api('/projects');
  if(!projects.some(p => p.name === project)) project = projects[0].name;
  $('plist').innerHTML = projects.map(p =>
    `<div class="pj${p.name===project?' on':''}" data-n="${p.name}"><span>${p.name}</span></div>`).join('');
  $('pname').textContent = project;
  localStorage.setItem('studio.project', project);
}
async function switchTo(name){
  project = name; attached = []; stylePreset = null; shots = [];
  $('p').value = ''; $('hint').textContent = '';
  await loadProjects(); paintAttach(); await loadShots();
}
$('plist').onclick = e => { const el = e.target.closest('.pj'); if(el) switchTo(el.dataset.n); };
$('newp').onclick = async () => {
  const name = prompt('Project name');
  if(name === null) return;
  const r = await jpost('/projects', {name: name.trim() || 'untitled'});
  await switchTo(r.name);
};

/* ---------- attachments (the reference mechanism) ---------- */
function paintAttach(){
  $('attach').innerHTML =
    attached.map(n => `<div class="att"><img src="${imgURL('ref',n)}" alt="" data-n="${n}">
        <button data-x="${n}" title="Remove">&times;</button></div>`).join('')
    + (stylePreset ? `<span class="chipstyle">${stylePreset}<button id="rmstyle">&times;</button></span>` : '');
}
$('attach').onclick = e => {
  const x = e.target.closest('[data-x]');
  if(x){ attached = attached.filter(n => n !== x.dataset.x); return paintAttach(); }
  if(e.target.id === 'rmstyle'){ stylePreset = null; return paintAttach(); }
  const im = e.target.closest('img');
  if(im) openLightbox('ref', im.dataset.n, '');
};

async function attach(files){
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if(!list.length) return;
  $('hint').textContent = `adding ${list.length} reference${list.length>1?'s':''}…`;
  for(const f of list){
    try{
      const data = await new Promise(r => { const fr = new FileReader();
        fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
      const {name} = await jpost('/upload', {project, name: f.name, data});
      attached.push(name);
    }catch(err){ $('hint').textContent = String(err); paintAttach(); return; }
  }
  $('hint').textContent = attached.length > 2
    ? `${attached.length} references — the model uses the first 2` : '';
  paintAttach();
}
$('clip').onclick = () => $('file').click();
$('file').onchange = e => { attach(e.target.files); e.target.value = ''; };
window.addEventListener('paste', e => { if(e.clipboardData?.files?.length) attach(e.clipboardData.files); });

/* drag anywhere over the canvas */
let depth = 0;
const main = $('main');
['dragenter','dragover'].forEach(ev => main.addEventListener(ev, e => {
  e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  if(ev === 'dragenter' && ++depth === 1) $('drop').classList.add('on');
}));
main.addEventListener('dragleave', () => { if(--depth <= 0){ depth = 0; $('drop').classList.remove('on'); } });
main.addEventListener('drop', e => {
  e.preventDefault(); depth = 0; $('drop').classList.remove('on');
  if(e.dataTransfer.files?.length) attach(e.dataTransfer.files);
});

/* ---------- preset styles ---------- */
$('stylebtn').onclick = e => {
  e.stopPropagation();
  openMenu(e.clientX, e.clientY, Object.keys(presets).map(k => ({a:'style:'+k, t:k})));
};

/* ---------- feed ---------- */
async function loadShots(){
  shots = (await api('/shots?project='+encodeURIComponent(project))).shots;
  render();
}
function render(working, error){
  const f = $('feedin');
  if(!shots.length && !working && !error){
    f.innerHTML = `<div class="blank"><h2>Every shot, <b>one style.</b></h2>
      <p>Describe a beat below. Drop images in to steer the look.</p></div>`;
    return;
  }
  const cells = shots.map(s =>
    `<div class="card" data-n="${s.name}" data-p="${encodeURIComponent(s.prompt||'')}">
       <img loading="lazy" src="${imgURL('shot',s.name)}" alt="">
       <span class="tag">${s.prompt || s.name}</span></div>`);
  if(working) cells.unshift(`<div class="working"><div class="muted"><div class="spin"></div><span id="el">0.0s</span></div></div>`);
  f.innerHTML = (error?`<div class="err">${error}</div>`:'') + `<div class="grid ${view}">${cells.join('')}</div>`;
}
$('vt').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  view = b.dataset.v; localStorage.setItem('studio.view', view);
  [...$('vt').children].forEach(x => x.classList.toggle('on', x.dataset.v === view));
  render();
};
$('feedin').onclick = e => {
  const c = e.target.closest('.card'); if(!c) return;
  openLightbox('shot', c.dataset.n, decodeURIComponent(c.dataset.p||''));
};

/* ---------- lightbox ---------- */
function openLightbox(kind, name, promptText){
  const s = shots.find(x => x.name === name) || {};
  $('lbin').innerHTML = `<img src="${imgURL(kind,name)}" alt="">
    <div class="lbcap"><b>${name}</b>
      ${s.seed!=null?`<span>seed ${s.seed}</span>`:''}
      ${s.secs!=null?`<span>${s.secs}s</span>`:''}
      <a href="${imgURL(kind,name)}" download="${name}">Download</a>
      ${promptText?`<div class="pr" style="flex-basis:100%">${promptText}</div>`:''}
    </div>`;
  $('lb').classList.add('open');
}
$('lb').onclick = e => { if(!e.target.closest('.lbin') || e.target.tagName === 'IMG') $('lb').classList.remove('open'); };
$('lbin').onclick = e => { if(e.target.tagName === 'A') e.stopPropagation(); };

/* ---------- right-click ---------- */
const menu = $('menu');
function openMenu(x, y, items){
  menu.innerHTML = items.map(i => i.sep ? '<div class="msep"></div>'
    : `<div class="mi${i.dngr?' dngr':''}" data-a="${i.a}">${i.t}${i.k?`<span>${i.k}</span>`:''}</div>`).join('');
  menu.style.left = Math.min(x, innerWidth-210)+'px';
  menu.style.top  = Math.min(y, innerHeight-230)+'px';
  menu.classList.add('on');
}
document.addEventListener('click', () => menu.classList.remove('on'));
document.addEventListener('keydown', e => { if(e.key==='Escape'){
  menu.classList.remove('on'); $('lb').classList.remove('open'); $('drop').classList.remove('on'); }});

document.addEventListener('contextmenu', e => {
  const card = e.target.closest('.card'), att = e.target.closest('.att');
  if(!card && !att) return;
  e.preventDefault();
  if(card){
    menu.dataset.kind='shot'; menu.dataset.n=card.dataset.n; menu.dataset.p=card.dataset.p;
    openMenu(e.clientX, e.clientY, [
      {a:'useref', t:'Use as reference'},
      {a:'reuse',  t:'Reuse prompt'},
      {sep:1},
      {a:'download', t:'Download'},
      {a:'open',     t:'Open'},
      {a:'del',      t:'Delete', dngr:1},
    ]);
  }else{
    menu.dataset.kind='ref'; menu.dataset.n=att.querySelector('img').dataset.n; menu.dataset.p='';
    openMenu(e.clientX, e.clientY, [
      {a:'open', t:'Open'}, {a:'download', t:'Download'},
      {sep:1}, {a:'detach', t:'Remove', dngr:1},
    ]);
  }
});

menu.onclick = async e => {
  const mi = e.target.closest('.mi'); if(!mi) return;
  const a = mi.dataset.a, kind = menu.dataset.kind, n = menu.dataset.n;
  const pr = decodeURIComponent(menu.dataset.p||'');
  menu.classList.remove('on');

  if(a.startsWith('style:')){ stylePreset = a.slice(6); return paintAttach(); }
  if(a === 'reuse'){ const ta=$('p'); ta.value = pr; ta.focus(); ta.dispatchEvent(new Event('input')); return; }
  if(a === 'open'){ return openLightbox(kind, n, pr); }
  if(a === 'download'){
    const link = document.createElement('a');
    link.href = imgURL(kind,n); link.download = n; link.click(); return;
  }
  if(a === 'detach'){ attached = attached.filter(x => x !== n); return paintAttach(); }
  if(a === 'useref'){
    // attach the actual image, not its text
    const blob = await fetch(imgURL('shot',n)).then(r => r.blob());
    const data = await new Promise(r => { const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
    const up = await jpost('/upload', {project, name:n, data});
    attached.push(up.name); return paintAttach();
  }
  if(a === 'del'){
    await fetch(imgURL(kind,n), {method:'DELETE'});
    attached = attached.filter(x => x !== n);
    paintAttach(); loadShots(); loadProjects();
  }
};

/* ---------- generate ---------- */
const ta = $('p');
ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; });
ta.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('go').click(); }});

$('go').onclick = async () => {
  const txt = ta.value.trim(); if(!txt) return ta.focus();
  const [w,h] = $('ratio').value.split('x').map(Number);
  busy = true; $('go').disabled = true; render(true);
  const t0 = Date.now();
  const tick = setInterval(()=>{ const el=$('el'); if(el) el.textContent=((Date.now()-t0)/1000).toFixed(1)+'s'; },100);
  try{
    const r = await jpost('/generate',{prompt:txt, project, preset:stylePreset, width:w, height:h,
      steps:+$('steps').value, seed:-1, ref_paths:attached});
    $('hint').textContent = `${r.generate_s}s · seed ${r.seed}`
      + (r.refs_dropped ? ` · ${r.refs_dropped} reference ignored (model takes 2)` : '');
    ta.value=''; ta.style.height='auto';
    await loadShots();
    $('feed').scrollTo({top:0,behavior:'smooth'});
  }catch(e){ render(false, typeof e==='string'?e:JSON.stringify(e)); $('hint').textContent=''; }
  finally{ clearInterval(tick); busy=false; $('go').disabled=false; }
};

/* ---------- boot ---------- */
(async () => {
  try{ presets = (await api('/config')).presets || {}; }catch{}
  [...$('vt').children].forEach(x => x.classList.toggle('on', x.dataset.v === view));
  await loadProjects(); paintAttach(); await loadShots();
})();
poll(); setInterval(poll, 5000);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b; --panel:#141416; --panel2:#1c1c1f; --line:#2a2a2e;
  --text:#f2f2f3; --dim:#8a8a92; --accent:#5b5bd6; --accent2:#7c7cf0;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --r:10px;
}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh}

/* ---- left panel ---- */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--bad)}
.sec{padding:18px 20px;border-bottom:1px solid var(--line)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:9px;font-weight:600}
textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);color:var(--text);padding:11px 12px;font:inherit;resize:vertical;min-height:96px;outline:none;transition:border-color .15s}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:#55555c}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--dim);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:#3d3d44;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);color:var(--text);padding:9px 10px;font:inherit;outline:none}
select:focus,input:focus{border-color:var(--accent)}
.slider{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--accent)}
.val{font-variant-numeric:tabular-nums;color:var(--dim);min-width:22px;text-align:right;font-size:13px}
.go{width:100%;background:var(--accent);color:#fff;border:0;border-radius:var(--r);padding:13px;font:600 14px/1 inherit;cursor:pointer;transition:.15s}
.go:hover:not(:disabled){background:var(--accent2)}
.go:disabled{opacity:.5;cursor:not-allowed}
.meta{font-size:11px;color:var(--dim);text-align:center;margin-top:9px;font-variant-numeric:tabular-nums}

/* ---- refs ---- */
.refhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.clear{font-size:11px;color:var(--dim);cursor:pointer;background:0;border:0;font-family:inherit}
.clear:hover{color:var(--text)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-height:170px;overflow-y:auto}
.thumb{aspect-ratio:16/9;border-radius:5px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--panel2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on{border-color:var(--accent)}

/* ---- main ---- */
.main{display:flex;flex-direction:column;overflow:hidden}
.bar{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px}
.stat{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.stat b{color:var(--text);font-weight:600}
.stage{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:22px}
.hero{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.hero img{max-width:100%;max-height:68vh;border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.empty{color:#4a4a52;text-align:center;font-size:13px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:#ff9d96;padding:13px 15px;border-radius:var(--r);font-size:13px;white-space:pre-wrap;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.card{aspect-ratio:16/9;border-radius:7px;overflow:hidden;cursor:pointer;background:var(--panel2);border:1px solid var(--line)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover{border-color:var(--accent)}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><h1>Studio</h1><span class="dot" id="dot"></span></div>

    <div class="sec">
      <div class="lbl">Prompt</div>
      <textarea id="prompt" placeholder="a stickman sweating beside a desk fan, blue airflow curves, red heat lines"></textarea>
    </div>

    <div class="sec">
      <div class="lbl">Style</div>
      <div class="chips" id="presets"></div>
    </div>

    <div class="sec">
      <div class="refhead"><div class="lbl" style="margin:0">Reference</div><button class="clear" id="clearref">clear</button></div>
      <select id="video" style="margin-bottom:8px"></select>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="sec">
      <div class="lbl">Output</div>
      <div class="row" style="margin-bottom:8px">
        <select id="ratio">
          <option value="1024x576">16:9</option>
          <option value="576x1024">9:16</option>
          <option value="1024x1024">1:1</option>
          <option value="1024x768">4:3</option>
        </select>
        <input type="number" id="seed" value="-1" title="seed, -1 = random">
      </div>
      <div class="slider"><span style="font-size:12px;color:var(--dim)">Steps</span>
        <input type="range" id="steps" min="4" max="20" value="8"><span class="val" id="stepsv">8</span></div>
    </div>

    <div class="sec" style="border:0;margin-top:auto">
      <button class="go" id="go">Generate</button>
      <div class="meta" id="meta"></div>
    </div>
  </aside>

  <main class="main">
    <div class="bar">
      <div class="stat" id="status">connecting…</div>
      <div class="stat" id="timing"></div>
    </div>
    <div class="stage">
      <div class="hero" id="hero"><div class="empty">Write a prompt and hit Generate</div></div>
      <div><div class="lbl" style="margin-bottom:10px">Recent</div><div class="grid" id="grid"></div></div>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let PRESETS = {}, activePreset = null, activeRef = null, busy = false;

const api = (p, o) => fetch('/api' + p, o).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.detail || r.statusText)));

// ---- status -------------------------------------------------------------
async function poll() {
  try {
    const h = await api('/health');
    const ready = h.status === 'ready';
    $('dot').className = 'dot ' + (ready ? 'ok' : '');
    const split = h.device_split && h.device_split.moved && h.device_split.moved.length;
    $('status').innerHTML = ready
      ? `<b>ready</b> · ${h.vram_free_gb} GB free · ${split ? 'dual-GPU' : 'single GPU'}`
      : `<b>loading…</b> model is still warming up`;
    $('go').disabled = !ready || busy;
    const s = await api('/stats');
    if (s.n) $('timing').innerHTML = `median <b>${s.median_s}s</b> · ${s.n} generated`;
  } catch (e) {
    $('dot').className = 'dot bad';
    $('status').innerHTML = '<b>server unreachable</b>';
    $('go').disabled = true;
  }
}

// ---- setup --------------------------------------------------------------
async function init() {
  const cfg = await api('/config');
  PRESETS = cfg.presets;
  $('presets').innerHTML = Object.keys(PRESETS)
    .map(k => `<div class="chip" data-k="${k}">${k}</div>`).join('');
  $('presets').onclick = e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const k = c.dataset.k;
    activePreset = activePreset === k ? null : k;
    [...$('presets').children].forEach(x => x.classList.toggle('on', x.dataset.k === activePreset));
  };
  $('video').innerHTML = cfg.videos.map(v => `<option>${v}</option>`).join('');
  $('video').onchange = loadRefs;
  if (cfg.videos.length) loadRefs();
  loadShots();
}

async function loadRefs() {
  const r = await api('/refs?video=' + encodeURIComponent($('video').value));
  $('thumbs').innerHTML = r.refs.map(p =>
    `<div class="thumb" data-p="${p}"><img loading="lazy" src="/api/file?path=${encodeURIComponent(p)}"></div>`).join('');
  $('thumbs').onclick = e => {
    const t = e.target.closest('.thumb'); if (!t) return;
    activeRef = activeRef === t.dataset.p ? null : t.dataset.p;
    [...$('thumbs').children].forEach(x => x.classList.toggle('on', x.dataset.p === activeRef));
  };
}
$('clearref').onclick = () => { activeRef = null; [...$('thumbs').children].forEach(x => x.classList.remove('on')); };

async function loadShots() {
  const s = await api('/shots');
  $('grid').innerHTML = s.shots.map(n =>
    `<div class="card" data-n="${n}"><img loading="lazy" src="/api/shot?name=${encodeURIComponent(n)}"></div>`).join('');
  $('grid').onclick = e => {
    const c = e.target.closest('.card'); if (!c) return;
    $('hero').innerHTML = `<img src="/api/shot?name=${encodeURIComponent(c.dataset.n)}">`;
  };
}

// ---- generate -----------------------------------------------------------
$('steps').oninput = e => $('stepsv').textContent = e.target.value;

$('go').onclick = async () => {
  const p = $('prompt').value.trim();
  if (!p) return $('prompt').focus();
  const [w, h] = $('ratio').value.split('x').map(Number);
  busy = true; $('go').disabled = true;
  $('hero').innerHTML = '<div class="empty"><div class="spin"></div>generating…</div>';
  const t0 = Date.now();
  const tick = setInterval(() => $('meta').textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's', 100);
  try {
    const r = await api('/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: p, preset: activePreset, width: w, height: h,
        steps: +$('steps').value, seed: +$('seed').value,
        ref_paths: activeRef ? [activeRef] : []
      })
    });
    $('hero').innerHTML = `<img src="/api/shot?name=${encodeURIComponent(r.name)}&t=${Date.now()}">`;
    $('meta').textContent = `${r.generate_s}s · seed ${r.seed}`;
    loadShots();
  } catch (e) {
    $('hero').innerHTML = `<div class="err">${typeof e === 'string' ? e : JSON.stringify(e)}</div>`;
    $('meta').textContent = '';
  } finally {
    clearInterval(tick); busy = false; $('go').disabled = false;
  }
};

init(); poll(); setInterval(poll, 5000);
</script>
</body>
</html>

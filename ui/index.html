<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>
<style>
:root{
  --bg:#08080b; --panel:#131318; --panel2:#1b1b22; --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.15); --tx:#f0f0f5; --dim:#8d8d9c; --dim2:#5c5c6b;
  --ac:#7c6cf0; --ac2:#a08cff; --acdim:rgba(124,108,240,.16); --ok:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow:hidden;
  font:400 13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
[hidden]{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.grow{flex:1}

.app{display:grid;grid-template-columns:246px minmax(0,1fr);height:100vh}

/* ---------- sidebar ---------- */
.sidebar{display:flex;flex-direction:column;min-height:0;padding:18px 14px 16px;
  border-right:1px solid var(--line);background:rgba(10,10,14,.55);position:relative}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 22px}
.mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(140deg,var(--ac2),var(--ac));
  box-shadow:0 0 16px rgba(124,108,240,.5);flex:none}
.brand span{font-size:16px;font-weight:650;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.navi{display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:11px;
  color:var(--dim);font-size:13.5px;font-weight:550;transition:.14s;text-align:left}
.navi svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.navi:hover{color:var(--tx);background:var(--panel)}
.navi.on{color:var(--tx);background:var(--acdim)}
.navi.on svg{stroke:var(--ac2)}

.sidebottom{display:flex;flex-direction:column;gap:8px}
.statuscard{display:flex;align-items:center;gap:9px;height:38px;padding:0 13px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:11.5px;
  font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--bad)}
.proj{position:relative}
.projcard{display:flex;align-items:center;gap:10px;width:100%;height:56px;padding:0 10px;
  border-radius:14px;border:1px solid var(--line2);background:var(--panel);transition:.15s}
.projcard:hover{border-color:var(--ac);background:var(--panel2)}
.avatar{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--ac2),var(--ac));color:#fff;font-size:13px;font-weight:700}
.projtext{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.projtext b{font-size:12.5px;font-weight:650;max-width:120px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.projtext span{font-size:10.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.projcard .caret{width:13px;height:13px;stroke:var(--dim);fill:none;stroke-width:2;flex:none}
.projmenu{position:absolute;bottom:64px;left:0;z-index:70;width:262px;padding:8px;display:none;
  background:var(--panel2);border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
.projmenu.on{display:block}
.pmerr{color:#fca5a5;font-size:11px;padding:7px 9px;margin:2px 2px 8px;background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.25);border-radius:8px}
.pm-head{display:flex;gap:7px;padding:2px 2px 8px;border-bottom:1px solid var(--line)}
.pm-head input{flex:1;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);
  background:var(--panel);color:var(--tx);font:inherit;outline:none}
.pm-head input:focus{border-color:var(--ac)}
.pm-head button{height:32px;padding:0 11px;border-radius:8px;background:var(--ac);color:#fff;
  font-size:12.5px;font-weight:600;flex:none}
.pm-head button:hover{filter:brightness(1.12)}
.pm-list{max-height:220px;overflow-y:auto;margin:6px 0}
.pmi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:8px 10px;border-radius:8px;font-size:13px;color:var(--dim);text-align:left;transition:.12s}
.pmi:hover{background:var(--panel);color:var(--tx)}
.pmi.on{color:var(--tx);background:var(--acdim)}
.pmi b{font-size:10.5px;font-weight:600;color:var(--dim2);font-variant-numeric:tabular-nums;flex:none}
.pm-new{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;
  border:1px dashed var(--line2);color:var(--dim);font-size:12.5px;font-weight:550;transition:.14s}
.pm-new:hover{color:var(--ac2);border-color:var(--ac);background:var(--acdim)}
.pm-new svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- right column ---------- */
.col{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}

.topbar{display:flex;align-items:center;gap:10px;height:58px;flex:none;padding:0 26px}
.searchbox{display:flex;align-items:center;gap:8px;height:36px;width:36px;padding:0 10px;
  border-radius:11px;background:var(--panel);border:1px solid var(--line);overflow:hidden;
  transition:width .18s,background .18s}
.searchbox:focus-within,.searchbox.filled{width:230px;background:var(--panel2);border-color:var(--line2)}
.searchbox svg{flex:none;width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit}
.searchbox input::placeholder{color:var(--dim2)}
.icbtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);flex:none;transition:.14s}
.icbtn:hover{color:var(--tx);border-color:var(--line2)}
.icbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}

/* ---------- gallery ---------- */
.main{position:relative;min-height:0;overflow:hidden}
.feed{height:100%;overflow-y:auto;padding:2px 26px 12px;scrollbar-gutter:stable}
.feedin{max-width:1280px;margin:0 auto}
.hero{padding:6px 2px 26px}
.hero h1{font-size:33px;font-weight:600;letter-spacing:-.02em;line-height:1.16;color:var(--tx)}
.hero h1 b{font-weight:750}
.hero p{margin-top:9px;color:var(--dim);font-size:14px}
.sectionhead{display:flex;align-items:flex-end;gap:10px;margin:4px 2px 15px}
.sectionhead h2{font-size:15.5px;font-weight:650}
.uline{width:32px;height:3px;border-radius:2px;margin-top:7px;
  background:linear-gradient(90deg,var(--ac2),var(--ac))}
.modetoggle{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:2px;margin-left:14px}
.modetoggle button{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:550;
  color:var(--dim);transition:.14s}
.modetoggle button:hover{color:var(--tx)}
.modetoggle button.on{background:var(--panel);color:var(--tx)}
.viewall{display:flex;align-items:center;gap:4px;margin-left:auto;color:var(--dim);
  font-size:12px;font-weight:550;transition:.14s}
.viewall:hover{color:var(--ac2)}
.viewall svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.addcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:1px dashed var(--line2);color:var(--dim2);background:var(--panel);cursor:pointer;width:100%}
.addcard:hover{color:var(--ac2);border-color:var(--ac);background:var(--acdim)}
.addcard .addicon{font-size:30px;line-height:1;font-weight:400}
.addcard span:last-child{font-size:12px;font-weight:550}
.blank{padding:14vh 0;text-align:center;color:var(--dim)}
.blank p{font-size:14px;color:var(--dim)}
.blank b{color:var(--tx);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;cursor:grab;
  background:var(--panel);border:1px solid var(--line);transition:.18s}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.card.dragging{opacity:.35}
.dots{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:9px;display:grid;
  place-items:center;background:rgba(10,10,16,.72);border:1px solid var(--line2);color:var(--tx);
  backdrop-filter:blur(6px);opacity:0;transition:.15s}
.card:hover .dots{opacity:1}
.dots svg{width:15px;height:15px;fill:currentColor}
.card .secs{position:absolute;left:0;right:0;bottom:0;padding:7px 10px;font-size:11px;
  font-weight:600;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.01em;
  background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none}
.card .tag{position:absolute;left:11px;right:11px;bottom:10px;font-size:11px;font-weight:550;
  color:#fff;opacity:0;transition:.15s;text-shadow:0 1px 8px rgba(0,0,0,.95);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card:hover .tag{opacity:1}
/* list view */
.grid.list{grid-template-columns:1fr;gap:8px}
.grid.list .card{aspect-ratio:auto;display:grid;grid-template-columns:150px 1fr;align-items:center;
  gap:14px;padding:9px;cursor:pointer}
.grid.list .card img{height:84px;border-radius:11px}
.grid.list .card:hover{transform:none}
.grid.list .tag{position:static;opacity:1;text-shadow:none;color:var(--dim);white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid.list .dots{top:50%;right:14px;transform:translateY(-50%);opacity:1}
.working{grid-column:1/-1;border-radius:16px;border:1px dashed var(--line2);background:var(--panel);
  display:grid;place-items:center;min-height:160px}
.spin{width:26px;height:26px;border:2.5px solid var(--line2);border-top-color:var(--ac2);
  border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 11px}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--dim2);font-size:12.5px;text-align:center;font-variant-numeric:tabular-nums}
.err{margin:0 auto 14px;max-width:640px;color:#fca5a5;background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.25);padding:13px 15px;border-radius:12px;
  font-size:12.5px;white-space:pre-wrap}

/* ---------- drop feedback ---------- */
/* The drop target is the composer's text prompt -- the highlight appears only
   around that input, never as a full-screen overlay over the gallery. */
.dock.dragover{border-color:var(--ac);box-shadow:0 0 0 3px var(--acdim),0 20px 60px rgba(0,0,0,.35)}
.dock.dragover #p{box-shadow:0 0 0 3px var(--acdim),0 0 0 1.5px var(--ac);
  border-radius:12px;background:rgba(124,108,240,.08)}

/* ---------- dock / composer ---------- */
.dockwrap{flex:none;padding:0 26px 20px}
.dock{max-width:1280px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);
  border-radius:22px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}

/* references — always visible, never a collapsing drawer */
.refbar{display:flex;align-items:center;gap:12px;padding:9px 7px;margin-bottom:4px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.refcap{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--dim2);flex:none}
.refhint{font-size:11px;color:var(--dim2);margin-left:auto}
.refslots{display:flex;gap:8px;align-items:center}
.slot{position:relative;width:60px;height:60px;border-radius:12px;overflow:hidden;flex:none}
.slot.empty{border:1px dashed var(--line2);background:var(--panel2);color:var(--dim2);transition:.14s}
.slot.empty:hover{color:var(--ac2);border-color:var(--ac);background:var(--acdim)}
.slot.empty .slotadd{width:100%;height:100%;display:grid;place-items:center;font-size:22px;line-height:1}
.slot.filled{border:1px solid var(--line2);background:var(--panel2)}
.slot.filled img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.slot .idx{position:absolute;left:3px;bottom:3px;font-size:8.5px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.7);border-radius:5px;padding:1px 4px}
.slot .x{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;
  background:rgba(0,0,0,.75);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center}
.slot .x:hover{background:var(--bad)}

/* prompt bar */
.bar{display:flex;align-items:flex-end;gap:8px;padding:5px}
#p{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;resize:none;
  padding:9px 6px;max-height:120px;line-height:1.5}
#p::placeholder{color:var(--dim2)}
.ib{position:relative;width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);display:grid;place-items:center;transition:.14s}
.ib:hover{color:var(--tx);border-color:var(--line2)}
.ib.on{color:var(--ac2);border-color:var(--ac)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

/* controls row */
.controls{display:flex;align-items:center;gap:8px;padding:9px 5px 3px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 11px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:12.5px;font-weight:550}
.pill svg{width:14px;height:14px;stroke:var(--dim2);fill:none;stroke-width:2;flex:none}
.pill select{appearance:none;background:none;border:0;color:var(--tx);font:inherit;outline:0;
  cursor:pointer;padding:0 4px}
.pill select option{background:#15151b;color:var(--tx)}
.seedpill input{width:64px;background:none;border:0;outline:0;color:var(--tx);font:inherit}
.seedpill input::placeholder{color:var(--dim2)}
.genbtn{display:flex;align-items:center;gap:8px;height:42px;padding:0 20px;border:0;border-radius:14px;
  color:#fff;background:linear-gradient(135deg,var(--ac2),var(--ac));font-size:13.5px;font-weight:650;
  box-shadow:0 8px 22px rgba(124,108,240,.35);transition:.15s;flex:none}
.genbtn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.genbtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.genbtn svg{width:15px;height:15px;fill:#fff;stroke:none}
.hint{text-align:center;font-size:11px;color:var(--dim2);margin-top:6px;min-height:15px;
  font-variant-numeric:tabular-nums}

/* ---------- context menu ---------- */
.menu{position:fixed;z-index:80;min-width:188px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:12px;padding:5px;display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.7)}
.menu.on{display:block}
.mi{padding:8px 11px;border-radius:8px;font-size:12.5px;color:var(--tx);cursor:pointer;
  display:flex;justify-content:space-between;gap:14px}
.mi:hover{background:var(--panel)}
.mi.dngr{color:#fca5a5}
.mi span{color:var(--dim2);font-size:11px}
.msep{height:1px;background:var(--line);margin:4px 6px}

/* ---------- lightbox (big preview) ---------- */
.lb{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:26px;
  background:rgba(5,5,9,.94);backdrop-filter:blur(12px)}
.lb.open{display:grid}
.lbin{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:min(1560px,96vw);
  max-height:100%}
.lbimg{max-width:96vw;max-height:74vh;object-fit:contain;border-radius:14px;
  box-shadow:0 30px 100px rgba(0,0,0,.7);display:block}
.lbcap{text-align:center;max-width:820px}
.lbcap h3{font-size:18px;font-weight:650;letter-spacing:-.01em;margin-bottom:3px}
.lbcap .lprompt{color:var(--dim);font-size:12.5px;max-width:720px;margin:0 auto 10px}
.lbcap .lmeta{color:var(--dim2);font-size:11px;font-variant-numeric:tabular-nums;margin-bottom:12px}
.lbacts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lbb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;
  font-size:12.5px;font-weight:600;border:1px solid var(--line2);background:var(--panel);transition:.13s}
.lbb:hover{border-color:var(--ac);color:var(--tx)}
.lbb.prim{background:var(--ac);border-color:var(--ac);color:#fff}
.lbb.prim:hover{filter:brightness(1.12)}
.lbb.dngr{color:#fca5a5}
.lbb.dngr:hover{border-color:var(--bad);background:rgba(248,113,113,.1)}
.lbb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* drag ghost */
.ghost{position:fixed;top:-100px;left:-100px;padding:6px 12px;border-radius:9px;background:var(--ac);
  color:#fff;font-size:12px;font-weight:600;pointer-events:none;z-index:200}

@media(max-width:860px){
  .app{grid-template-columns:76px minmax(0,1fr)}
  .brand span,.navi span,.projtext,.statuscard span:last-child{display:none}
  .navi{justify-content:center;padding:0}
  .projcard{justify-content:center;padding:0;width:44px;height:44px}
  .projcard .caret{display:none}
  .statuscard{justify-content:center;width:44px;padding:0}
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:26px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark"></div><span>Studio</span></div>
    <nav class="nav">
      <button class="navi on" data-nav="create" data-mode="shots"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg><span>Create</span></button>
      <button class="navi" data-nav="creations" data-mode="shots"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span>My Creations</span></button>
      <button class="navi" data-nav="explore" data-mode="refs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m14.7 9.3-2 5.4-5.4 2 2-5.4z"/></svg><span>Explore</span></button>
    </nav>
    <div class="grow"></div>
    <div class="sidebottom">
      <div class="statuscard"><span class="dot" id="dot"></span><span id="stat">connecting</span></div>
      <div class="proj" id="projbox">
        <button class="projcard" id="projbtn" title="Projects">
          <div class="avatar" id="avatar">U</div>
          <div class="projtext"><b id="pname">untitled</b><span id="pshots">0 shots</span></div>
          <svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="projmenu" id="projmenu">
          <div class="pmerr" id="pmerr" hidden></div>
          <div class="pm-head">
            <input id="projname" placeholder="Rename project…" spellcheck="false">
            <button id="projrename">Rename</button>
          </div>
          <div class="pm-list" id="pmList"></div>
          <button class="pm-new" id="newp"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New project</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="col">
    <header class="topbar">
      <div class="grow"></div>
      <label class="searchbox" id="searchbox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="Search your creations…">
      </label>
      <button class="icbtn" id="viewbtn" title="Toggle grid/list"></button>
    </header>

    <main class="main" id="main">
      <div class="feed" id="feed">
        <div class="feedin" id="feedin">
          <div class="hero">
            <h1 id="herotitle">Turn your imagination into <b>stunning visuals.</b></h1>
            <p id="herosub">Describe. Generate. Be inspired.</p>
          </div>
          <div class="sectionhead">
            <div><h2 id="sectiontitle">My Creations</h2><div class="uline"></div></div>
            <div class="modetoggle" id="modetoggle">
              <button class="on" data-mode="shots">My Creations</button>
              <button data-mode="refs">References</button>
            </div>
            <button class="viewall" id="viewall">View all<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
          </div>
          <div id="gridwrap"></div>
        </div>
      </div>
    </main>

    <footer class="dockwrap">
      <div class="dock" id="dock">
        <div class="refbar">
          <span class="refcap">References</span>
          <div class="refslots" id="refslots"></div>

              <option value="1024x576">16:9</option><option value="576x1024">9:16</option>
              <option value="1024x1024">1:1</option><option value="1024x768">4:3</option>

          <label class="pill" title="Quality / steps">
            <svg viewBox="0 0 24 24"><path d="m12 3 1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>
            <select id="steps">
              <option value="4">Max speed</option><option value="6">Fast</option>
              <option value="8" selected>Balanced</option>
              <option value="12">High</option><option value="16">Ultra</option>
            </select>
          </label>
          <label class="pill" title="Style preset">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1-2-.6-.6-.2-1.7 1-1.7h1.3A4.7 4.7 0 0 0 20 12.6C20 7.3 16.6 3 12 3Z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="16" cy="11" r="1"/></svg>
            <select id="stylesel"><option value="">No style</option></select>

          <label class="pill seedpill" id="seedpill" hidden title="Seed — blank is random">

<div class="menu" id="menu"></div>
<div class="lb" id="lb"><div class="lbin" id="lbin"></div></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
const $ = id => document.getElementById(id);
const api = (p,o) => fetch('/api'+p,o).then(r => r.ok ? r.json()
  : r.json().then(e => Promise.reject(e.detail||r.statusText), () => Promise.reject(r.statusText)));
const jpost = (p,b) => api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const imgURL = (kind,name) => kind === 'frame'
  ? `/api/img?kind=frame&name=${encodeURIComponent(name)}`
  : `/api/img?kind=${kind}&project=${encodeURIComponent(project)}&name=${encodeURIComponent(name)}`;
const base = name => String(name).split('/').pop();

let project = localStorage.getItem('studio.project') || 'untitled';
let attached = [], shots = [], videos = [], railItems = [], busy = false;
let stylePreset = null, presets = {};
let view = localStorage.getItem('studio.view') || 'grid';
let mode = 'shots';                       // which collection the grid shows
let query = '';                           // search filter
let lastServerBusy = false;               // a generation running that this tab didn't start

/* ---------- status ---------- */
async function poll(){
  try{
    const h = await api('/health'), s = await api('/stats');
    const up = h.status === 'ready';
    $('dot').className = 'dot ' + (up ? 'ok' : '');
    $('stat').textContent = up
      ? [h.vram_free_gb ? h.vram_free_gb+' GB free' : null, s.n ? 'median '+s.median_s+'s' : null]
        .filter(Boolean).join(' · ') || 'ready'
      : 'loading model…';
    if(h.speed){
      $('stat').title = h.speed.msg;                       // hover for the full diagnosis
      if(h.speed.flag === 'selftest-failed') $('stat').textContent = '⚠ self-test failed';
    }
    $('go').disabled = !up || busy;
    // A generation this tab did not start (closed mid-render, or another tab)
    // is still in flight on the server: show the working tile with the live
    // elapsed time, then refresh the gallery once it lands.
    if(up && h.busy && !busy){
      if(!lastServerBusy){
        lastServerBusy = true;
        $('hint').textContent = 'generating…';
      }
      // Boot's first loadShots() renders the plain grid after the first poll
      // has already flagged the in-flight generation, so re-apply the working
      // tile whenever it is missing (not just once -- that race hides it).
      if(!document.querySelector('#gridwrap .working')) render(true);
      const el = $('el');
      if(el && h.generating) el.textContent = `${h.generating.elapsed_s}s (in progress)`;
    }else if(lastServerBusy){
      lastServerBusy = false;
      $('hint').textContent = '';
      await loadShots();
      render();
    }
  }catch{ $('dot').className='dot bad'; $('stat').textContent='offline'; $('go').disabled=true; }
}

/* ---------- projects ---------- */
async function loadProjects(){
  const {projects} = await api('/projects');
  // An empty studio is valid: keep a working name so the first generate has
  // somewhere to go, but do not create anything on disk until it is needed.
  if(!projects.length) project = project || 'untitled';
  else if(!projects.some(p => p.name === project)) project = projects[0].name;
  $('pname').textContent = project;
  $('avatar').textContent = (project[0] || 'U').toUpperCase();
  const cur = projects.find(p => p.name === project);
  $('pshots').textContent = `${cur ? cur.shots : 0} shots`;
  $('pmList').innerHTML = projects.map(p =>
    `<button class="pmi${p.name===project?' on':''}" data-n="${p.name}">
       <span>${p.name}</span><b>${p.shots} shots</b></button>`).join('');
  localStorage.setItem('studio.project', project);
}
async function switchTo(name){
  project = name; attached = []; stylePreset = null; shots = [];
  $('p').value = ''; $('hint').textContent = ''; $('stylesel').value = '';
  await Promise.all([loadProjects(), loadRefs()]);
  paintAttach(); await loadShots();
}
async function uniqueProjectName(){
  const {projects} = await api('/projects');
  const taken = new Set(projects.map(p => p.name));
  let name = 'untitled', i = 1;
  while(taken.has(name)) name = `untitled ${++i}`;
  return name;
}
function pmError(err){
  $('pmerr').textContent = typeof err === 'string' ? err : (err?.message || err?.detail || String(err));
  $('pmerr').removeAttribute('hidden');
}
async function renameTo(name){
  name = (name||'').trim();
  if(!name || name === project) return closeProjMenu();
  try{
    const r = await jpost('/rename', {project, name});
    await switchTo(r.name);
    closeProjMenu();
  }catch(err){ pmError(err); }
}
function openProjMenu(){
  $('projmenu').classList.add('on');
  $('pmerr').setAttribute('hidden','');
  $('projname').value = project;
  $('projname').select();
  $('projname').focus();
}
function closeProjMenu(){ $('projmenu').classList.remove('on'); }
$('projbtn').onclick = e => { e.stopPropagation(); $('projmenu').classList.toggle('on'); if($('projmenu').classList.contains('on')) openProjMenu(); };
$('pmList').onclick = e => {
  const b = e.target.closest('.pmi'); if(!b) return;
  closeProjMenu();
  if(b.dataset.n !== project) switchTo(b.dataset.n);
};
$('projname').onkeydown = e => {
  if(e.key === 'Enter'){ e.preventDefault(); renameTo($('projname').value); }
  if(e.key === 'Escape') closeProjMenu();
};
$('projrename').onclick = () => renameTo($('projname').value);
// New project opens a blank project immediately and drops you into rename.
$('newp').onclick = async () => {
  try{
    const r = await jpost('/projects', {name: await uniqueProjectName()});
    await switchTo(r.name);
    openProjMenu();
  }catch(err){ pmError(err); }
};
document.addEventListener('click', e => {
  if(!e.target.closest('.proj')) closeProjMenu();
});

/* ---------- reference images (frames corpus + uploaded refs) — shown in the
   main "References" view, not a separate drawer ---------- */
async function loadRefs(){
  const [{videos: v}, {refs: r}] = await Promise.all([api('/frames'), api('/refs?project='+encodeURIComponent(project))]);
  videos = v || [];
  const items = [];
  for(const vid of videos){
    for(const f of vid.frames) items.push({kind:'frame', name:`${vid.video}/${f}`, label:f.replace(/\.\w+$/,'').replace(/^\d+_/,'')});
  }
  for(const f of r) items.push({kind:'ref', name:f, label:f.replace(/\.\w+$/,'')});
  railItems = items;
  if(mode === 'refs') render();
}
async function removeRef(name){
  try{ await fetch(`/api/img?kind=ref&project=${encodeURIComponent(project)}&name=${encodeURIComponent(name)}`, {method:'DELETE'}); }
  catch{}
  attached = attached.filter(x => x !== name);
  paintAttach(); loadRefs();
}

/* ---------- selection (attached references — 2 slots, max) ---------- */
function paintAttach(){
  $('refslots').innerHTML = [0, 1].map(i => {
    const n = attached[i];
    if(!n) return `<div class="slot empty" data-i="${i}"><button class="slotadd" data-upload title="Upload an image">+</button></div>`;
    return `<div class="slot filled" data-i="${i}" title="${n}"><img src="${imgURL('ref',n)}" alt="" data-n="${n}">
       <b class="idx">${i+1}</b><button class="x" data-x="${n}">&times;</button></div>`;
  }).join('');
}
$('refslots').onclick = e => {
  const x = e.target.closest('[data-x]');
  if(x){ attached = attached.filter(n => n !== x.dataset.x); return paintAttach(); }
  if(e.target.closest('[data-upload]')){ $('file').click(); return; }
  const im = e.target.closest('img');
  if(im) openLightbox('ref', im.dataset.n, '', im.dataset.n);
};

async function attach(files){
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if(!list.length) return;
  const room = 2 - attached.length;
  if(room <= 0){ $('hint').textContent = '2 references already attached — remove one first'; return; }
  const use = list.slice(0, room), dropped = list.length - use.length;
  $('hint').textContent = `adding ${use.length} reference${use.length>1?'s':''}…`;
  for(const f of use){
    try{
      const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
      const {name} = await jpost('/upload', {project, name: f.name, data});
      if(!attached.includes(name)) attached.push(name);
    }catch(err){ $('hint').textContent = String(err); paintAttach(); return; }
  }
  $('hint').textContent = dropped ? `${dropped} extra image ignored — 2 references max` : '';
  paintAttach(); loadRefs();
}
$('file').onchange = e => { attach(e.target.files); e.target.value = ''; };
window.addEventListener('paste', e => { if(e.clipboardData?.files?.length) attach(e.clipboardData.files); });

/* turn any image into a real reference: click, drag, or right-click */
async function useAsRef(kind, name){
  if(attached.length >= 2){ $('hint').textContent = '2 references already attached — remove one first'; return; }
  // Already a stored ref image -- attach it directly instead of re-uploading
  // a duplicate copy every time it's picked.
  if(kind === 'ref'){
    const n = base(name);
    if(!attached.includes(n)) attached.push(n);
    paintAttach();
    $('hint').textContent = `${n} added as reference`;
    return;
  }
  try{
    const blob = await fetch(imgURL(kind,name)).then(r => r.blob());
    const data = await new Promise(r => { const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
    const up = await jpost('/upload', {project, name: base(name), data});
    if(!attached.includes(up.name)) attached.push(up.name);
    paintAttach();
    $('hint').textContent = `${up.name} added as reference`;
  }catch(err){ $('hint').textContent = String(err); }
}

/* ---------- drag & drop (shots, clips, files) ---------- */
function setDrag(e, payload){
  e.dataTransfer.setData('application/x-studio', JSON.stringify(payload));
  e.dataTransfer.setData('text/plain', payload.name);
  e.dataTransfer.effectAllowed = 'copy';
  const ghost = document.createElement('div');
  ghost.className = 'ghost'; ghost.textContent = 'add as reference';
  document.body.appendChild(ghost);
  e.dataTransfer.setDragImage(ghost, 40, 8);
  requestAnimationFrame(() => ghost.remove());
}
['dragover','drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));
// Each drop zone tracks its own enter/leave depth and highlights itself —
// a shared counter/overlay made the hint appear over the gallery even while
// dragging over the composer at the bottom.
const dropDepths = new WeakMap();
function isFileDrag(e){
  const t = e.dataTransfer && e.dataTransfer.types;
  return !!(t && [...t].includes('Files'));
}
// The visual highlight for a drop is the composer's text prompt only -- never
// the whole canvas. The gallery still accepts drops (a drop anywhere attaches
// the reference), but passes no highlight class so it stays out of the way.
function wireDrop(el, opts = {}){
  dropDepths.set(el, 0);
  // undefined -> default 'dragover'; null -> no visual feedback
  const clsFor = e => {
    const v = isFileDrag(e) ? opts.fileClass : opts.cardClass;
    return v === undefined ? 'dragover' : v;
  };
  ['dragenter','dragover'].forEach(ev => el.addEventListener(ev, e => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    if(ev === 'dragenter'){
      el.dataset.dropCls = clsFor(e);
      const d = (dropDepths.get(el) || 0) + 1;
      dropDepths.set(el, d);
      if(d === 1 && el.dataset.dropCls) el.classList.add(el.dataset.dropCls);
    }
  }));
  el.addEventListener('dragleave', () => {
    const d = Math.max(0, (dropDepths.get(el) || 0) - 1);
    dropDepths.set(el, d);
    if(d === 0 && el.dataset.dropCls) el.classList.remove(el.dataset.dropCls);
  });
  el.addEventListener('drop', e => {
    e.preventDefault(); dropDepths.set(el, 0); el.classList.remove('dragover');
    let payload = null;
    try{ payload = JSON.parse(e.dataTransfer.getData('application/x-studio') || 'null'); }catch{}
    if(payload && payload.name) return useAsRef(payload.kind || 'shot', payload.name);
    if(e.dataTransfer.files?.length) attach(e.dataTransfer.files);
  });
}
wireDrop($('main'), {fileClass: null, cardClass: null});
wireDrop($('dock'));

/* ---------- gallery ---------- */
async function loadShots(){
  shots = (await api('/shots?project='+encodeURIComponent(project))).shots;
  render();
}
function cardMenuItems(kind){
  const items = [{a:'useref', t:'Use as reference'}];
  if(kind === 'shot') items.push({a:'reuse', t:'Reuse prompt'});
  items.push({sep:1}, {a:'download', t:'Download'}, {a:'open', t:'Open'});
  if(kind !== 'frame') items.push({sep:1}, {a:'del', t:kind==='ref'?'Remove':'Delete', dngr:1});
  return items;
}
function render(working, error){
  const f = $('gridwrap');
  let items = mode === 'shots' ? shots
    : railItems.map(it => ({kind: it.kind, name: it.name, prompt: it.label || ''}));
  if(query){
    const q = query.toLowerCase();
    items = items.filter(s => (s.prompt || s.name).toLowerCase().includes(q));
  }
  const addTile = `<button class="card addcard" id="addcard" title="Upload a reference image">
      <span class="addicon">+</span><span>Upload image</span></button>`;
  if(!items.length && !working && !error){
    if(query){ f.innerHTML = `<div class="blank"><p>No matches for <b>${query}</b>.</p></div>`; return; }
    if(mode === 'refs'){ f.innerHTML = `<div class="grid ${view}">${addTile}</div>`; return; }
    f.innerHTML = `<div class="blank"><p>No shots yet — describe a beat below to generate your first one.</p></div>`;
    return;
  }
  const cells = items.map(s => {
    const k = mode === 'shots' ? 'shot' : s.kind;
    return `<div class="card" data-k="${k}" data-n="${s.name}" data-p="${encodeURIComponent(s.prompt||'')}" draggable="true">
       <img loading="lazy" src="${imgURL(k,s.name)}" alt="">
       <button class="dots" data-act="menu" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
       <span class="tag">${s.prompt || s.name}</span>
       ${s.secs!=null?`<span class="secs">Generated in ${s.secs}s</span>`:''}</div>`;
  });
  if(mode === 'refs') cells.unshift(addTile);
  if(working) cells.unshift(`<div class="working"><div class="muted"><div class="spin"></div><span id="el">0.0s</span></div></div>`);
  f.innerHTML = (error?`<div class="err">${error}</div>`:'') + `<div class="grid ${view}">${cells.join('')}</div>`;
}
function updateModeUI(){
  const creating = mode === 'shots';
  $('herotitle').innerHTML = creating
    ? 'Turn your imagination into <b>stunning visuals.</b>'
    : 'Browse and upload <b>reference images.</b>';
  $('herosub').textContent = creating
    ? 'Describe. Generate. Be inspired.'
    : 'The committed style corpus plus anything you upload — click a card\'s ⋯ menu to use it as a reference.';
  $('sectiontitle').textContent = creating ? 'My Creations' : 'References';
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; updateModeUI(); render();
});
$('viewall').onclick = () => {
  query = ''; $('search').value = ''; $('searchbox').classList.remove('filled');
  render();
  $('feed').scrollTo({top:0, behavior:'smooth'});
};
$('search').addEventListener('input', e => {
  query = e.target.value.trim();
  $('searchbox').classList.toggle('filled', query.length > 0);
  render();
});
const ICON_GRID = `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>`;
const ICON_LIST = `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>`;
function paintViewBtn(){
  $('viewbtn').innerHTML = view === 'grid' ? ICON_LIST : ICON_GRID;
  $('viewbtn').title = view === 'grid' ? 'Switch to list view' : 'Switch to grid view';
}
$('viewbtn').onclick = () => {
  view = view === 'grid' ? 'list' : 'grid';
  localStorage.setItem('studio.view', view);
  paintViewBtn(); render();
};
// Click a shot -> big preview. "..." -> menu. Drag to add as reference.
$('gridwrap').onclick = e => {
  if(e.target.closest('#addcard')){ $('file').click(); return; }
  const act = e.target.closest('[data-act="menu"]');
  const c = e.target.closest('.card');
  if(act && c){ e.stopPropagation();
    const k = c.dataset.k || 'shot';
    menu.dataset.kind = k; menu.dataset.n = c.dataset.n; menu.dataset.p = c.dataset.p;
    const r = act.getBoundingClientRect();
    openMenu(r.right - 4, r.bottom + 6, cardMenuItems(k));
    return; }
  if(c) openLightbox(c.dataset.k || 'shot', c.dataset.n, c.dataset.p);
};
$('gridwrap').ondblclick = e => {
  if(e.target.closest('#addcard')) return;
  const c = e.target.closest('.card'); if(c) openLightbox(c.dataset.k || 'shot', c.dataset.n, c.dataset.p);
};
$('gridwrap').addEventListener('dragstart', e => {
  const c = e.target.closest('.card'); if(!c || c.id === 'addcard') return;
  setDrag(e, {kind: c.dataset.k || 'shot', name:c.dataset.n});
  c.classList.add('dragging');
});
$('gridwrap').addEventListener('dragend', e => { const c = e.target.closest('.card'); if(c) c.classList.remove('dragging'); });

/* ---------- lightbox (big preview) ---------- */
function openLightbox(kind, name, promptText, title){
  const s = shots.find(x => x.name === name) || {};
  const pr = title || (promptText ? decodeURIComponent(promptText) : (s.prompt || ''));
  const meta = [s.seed!=null?`seed ${s.seed}`:null, s.secs!=null?`${s.secs}s`:null].filter(Boolean).join(' · ');
  const acts = [];
  if(kind !== 'ref') acts.push(`<button class="lbb prim" data-a="useref"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Use as reference</button>`);
  acts.push(`<a class="lbb" href="${imgURL(kind,name)}" download="${base(name)}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7-7 7 7M5 21h14"/></svg>Download</a>`);
  if(kind !== 'frame') acts.push(`<button class="lbb dngr" data-a="del"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Delete</button>`);
  $('lbin').innerHTML = `
    <img class="lbimg" src="${imgURL(kind,name)}" alt="">
    <div class="lbcap">
      <h3>${base(name)}</h3>
      ${meta?`<div class="lmeta">${meta}</div>`:''}
      ${pr?`<div class="lprompt">${pr}</div>`:''}
      <div class="lbacts">${acts.join('')}</div>
    </div>`;
  $('lb').dataset.kind = kind; $('lb').dataset.name = name;
  $('lb').classList.add('open');
}
$('lb').onclick = e => {
  if(e.target === $('lb') || e.target.classList.contains('lbimg')){ $('lb').classList.remove('open'); return; }
  const b = e.target.closest('[data-a]'); if(!b) return;
  const kind = $('lb').dataset.kind, name = $('lb').dataset.name;
  if(b.dataset.a === 'useref'){ useAsRef(kind, name); $('lb').classList.remove('open'); }
  if(b.dataset.a === 'del'){
    fetch(`/api/img?kind=${kind}&project=${encodeURIComponent(project)}&name=${encodeURIComponent(name)}`, {method:'DELETE'}).catch(()=>{});
    attached = attached.filter(x => x !== name);
    paintAttach(); loadShots(); loadRefs(); $('lb').classList.remove('open');
  }
};
$('lbin').onclick = e => { if(e.target.closest('a')) e.stopPropagation(); };

/* ---------- right-click menu ---------- */
const menu = $('menu');
function openMenu(x, y, items){
  menu.innerHTML = items.map(i => i.sep ? '<div class="msep"></div>'
    : `<div class="mi${i.dngr?' dngr':''}" data-a="${i.a}">${i.t}${i.k?`<span>${i.k}</span>`:''}</div>`).join('');
  menu.style.left = Math.min(x, innerWidth-220)+'px';
  menu.style.top  = Math.min(y, innerHeight-240)+'px';
  menu.classList.add('on');
}
document.addEventListener('click', () => menu.classList.remove('on'));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ menu.classList.remove('on'); $('lb').classList.remove('open'); closeProjMenu(); }
});
document.addEventListener('contextmenu', e => {
  const card = e.target.closest('.card'), slot = e.target.closest('.slot.filled');
  if(!card && !slot) return;
  e.preventDefault();
  if(card){
    if(card.id === 'addcard') return;
    menu.dataset.kind = card.dataset.k || 'shot'; menu.dataset.n=card.dataset.n; menu.dataset.p=card.dataset.p;
    openMenu(e.clientX, e.clientY, cardMenuItems(card.dataset.k || 'shot'));
  }else{
    menu.dataset.kind='ref'; menu.dataset.n=slot.querySelector('img').dataset.n; menu.dataset.p='';
    openMenu(e.clientX, e.clientY, [{a:'open', t:'Open'}, {a:'download', t:'Download'}, {sep:1}, {a:'detach', t:'Remove from shot', dngr:1}]);
  }
});
menu.onclick = async e => {
  const mi = e.target.closest('.mi'); if(!mi) return;
  const a = mi.dataset.a, kind = menu.dataset.kind, n = menu.dataset.n;
  const pr = decodeURIComponent(menu.dataset.p||'');
  menu.classList.remove('on');
  if(a === 'reuse'){ const ta=$('p'); ta.value = pr; ta.focus(); ta.dispatchEvent(new Event('input')); return; }
  if(a === 'open'){ return openLightbox(kind, n, pr); }
  if(a === 'download'){
    const link = document.createElement('a');
    link.href = imgURL(kind,n); link.download = base(n); link.click(); return;
  }
  if(a === 'detach'){ attached = attached.filter(x => x !== n); return paintAttach(); }
  if(a === 'useref'){ return useAsRef(kind, n); }
  if(a === 'del'){
    await fetch(`/api/img?kind=${kind}&project=${encodeURIComponent(project)}&name=${encodeURIComponent(n)}`, {method:'DELETE'}).catch(()=>{});
    attached = attached.filter(x => x !== n);
    paintAttach(); loadShots(); loadRefs();
  }
};

/* ---------- composer: seed ---------- */
$('advbtn').onclick = () => {
  const hidden = $('seedpill').hasAttribute('hidden');
  if(hidden){ $('seedpill').removeAttribute('hidden'); $('advbtn').classList.add('on'); }
  else{ $('seedpill').setAttribute('hidden',''); $('advbtn').classList.remove('on'); }
};
$('stylesel').onchange = e => { stylePreset = e.target.value || null; };

/* ---------- generate ---------- */
const ta = $('p');
ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; });
ta.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('go').click(); }});
$('go').onclick = async () => {
  const txt = ta.value.trim(); if(!txt) return ta.focus();
  const [w,h] = $('ratio').value.split('x').map(Number);
  const seedVal = $('seed').value.trim();
  busy = true; $('go').disabled = true; render(true);
  const t0 = Date.now();
  const tick = setInterval(()=>{ const el=$('el'); if(el) el.textContent=((Date.now()-t0)/1000).toFixed(1)+'s'; },100);
  try{
    const r = await jpost('/generate',{prompt:txt, project, preset:stylePreset, width:w, height:h,
      steps:+$('steps').value, seed:seedVal?+seedVal:-1, ref_paths:attached});
    $('hint').textContent = `${r.generate_s}s · seed ${r.seed}`
      + (r.refs_used ? ` · ${r.refs_used} reference${r.refs_used>1?'s':''} applied` : '')
      + (r.refs_dropped ? ` · ${r.refs_dropped} reference ignored (model takes 2)` : '');
    ta.value=''; ta.style.height='auto';
    // References are for this shot only — clear them once it's made instead of
    // silently reusing the same refs on every generation after.
    attached = []; paintAttach();
    mode = 'shots'; updateModeUI();
    await loadShots();
    $('feed').scrollTo({top:0,behavior:'smooth'});
  }catch(e){ render(false, typeof e==='string'?e:JSON.stringify(e)); $('hint').textContent=''; }
  finally{ clearInterval(tick); busy=false; $('go').disabled=false; }
};

/* ---------- boot ---------- */
(async () => {
  try{ presets = (await api('/config')).presets || {}; }catch{}
  $('stylesel').innerHTML = '<option value="">No style</option>'
    + Object.keys(presets).map(k => `<option value="${k}">${k}</option>`).join('');
  paintViewBtn();
  updateModeUI();
  await loadProjects(); await loadRefs(); paintAttach(); await loadShots();
  poll();   // re-check after the first gallery render, so an in-flight
            // generation (returned mid-render) puts its working tile on top
})();
poll(); setInterval(poll, 5000);
</script>
</body>
</html>
